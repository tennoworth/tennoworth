[package]
name = "wfm-scrape"
version = "0.1.0"
edition = "2021"
description = "Host-only market pipeline: `build` renders market.json + wfstat-catalog.json from the scrape CSV, `scrape` runs the WFM scrape. The only implementation - Python was retired 2026-08."
license = "MIT"

[dependencies]
market-math = { path = "../market-math" }
wfm-client = { path = "../wfm-client" }
csv = "1"
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
# Host-only binary - chrono is fine here (the player binary doesn't get it).
# Needed for the injected clock: ISO stamps, fromisoformat-style parsing of
# WFCD vault dates, and the vaulting-soon horizon arithmetic.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
lzma-rs = { version = "0.3.0", default-features = false }
base64.workspace = true

[lints]
workspace = true
