[package]
name = "tennoworth-publisher"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Private curated announcement publisher."
default-run = "tennoworth-publisher"

[features]
dev-server = []

[[bin]]
name = "tennoworth-publisher-dev"
path = "src/dev.rs"
required-features = ["dev-server"]

[dependencies]
# One process owns publication state and its atomic export at a time.
fs2 = "0.4"
announcement-feed = { path = "../announcement-feed" }
anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# process: the status page reads unit state through systemctl.
tokio = { workspace = true, features = ["process"] }
ts-rs = { workspace = true }
url = { workspace = true }

[dev-dependencies]
market-domain = { path = "../market-domain" }
base64 = { workspace = true }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
