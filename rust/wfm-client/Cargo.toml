[package]
name = "wfm-client"
version = "0.1.0"
edition = "2021"
description = "Shared WFM request budgets, signed policy verification and transport primitives."
license = "MIT"

[dependencies]
reqwest = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
ts-rs = { workspace = true }
# Accept IMF-fixdate and the two legacy HTTP-date formats without truncating delays.
httpdate = "1.0.3"
base64 = { workspace = true }
# Pure Rust verification; no signing material or native crypto dependency.
minisign-verify = "0.2.5"

[dev-dependencies]
# The send-site gate tokenizes sources so test-only items can be dropped one by
# one; a text split at the first `#[cfg(test)]` hid most of some files. Already
# in the lock through the build's proc macros; MIT OR Apache-2.0.
proc-macro2 = "1"

[lints]
workspace = true
