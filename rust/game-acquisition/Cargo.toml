[package]
name = "game-acquisition"
version = "0.1.0"
edition = "2021"
description = "Finds the running game, scans its memory for the session credentials and fetches the player's inventory from DE."
license = "MIT"

[dependencies]
anyhow = { workspace = true }
regex = "1"
regex-syntax = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[target.'cfg(target_os = "linux")'.dependencies]
# capget/capset and getauxval, to hold CAP_SYS_PTRACE effective only while the
# scan opens the game's memory. Already in the lockfile through the desktop.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Foundation",
] }

[lints]
workspace = true
