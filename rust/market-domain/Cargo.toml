[package]
name = "market-domain"
version = "0.1.0"
edition = "2021"
description = "Portable market heuristics, inventory and decision contracts."
license = "MIT"

[dependencies]
# Calendar rules parse snapshot ISO dates without consulting the system clock.
jiff = { workspace = true }
serde = { workspace = true }
# raw_value: WebRequest reads its input once the op is known (web.rs).
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
ts-rs = { workspace = true }

[lints]
workspace = true
