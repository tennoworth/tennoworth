[package]
name = "market-domain"
version = "0.1.0"
edition = "2021"
description = "Portable market heuristics, inventory and decision contracts."
license = "MIT"

[dependencies]
# Calendar rules parse snapshot ISO dates without consulting the system clock.
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
ts-rs = { workspace = true }

# The fixtures carry floats exactly as the page printed them; parse them back
# exactly, as market-domain-web does at the page boundary.
[dev-dependencies]
serde_json = { workspace = true, features = ["preserve_order", "float_roundtrip"] }

[lints]
workspace = true
