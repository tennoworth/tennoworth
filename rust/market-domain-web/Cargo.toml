[package]
name = "market-domain-web"
version = "0.1.0"
edition = "2021"
description = "The synchronous view rules of market-domain, compiled for the site and the desktop webview."
license = "MIT"
publish = false

[lib]
# cdylib is the wasm32 module the views load; rlib lets the host suite test it.
crate-type = ["cdylib", "rlib"]

[dependencies]
market-domain = { path = "../market-domain" }
# The page's numbers must come back bit-identical: JSON.parse rounds exactly,
# and serde_json's default float parser can be one ulp off.
serde_json = { workspace = true, features = ["float_roundtrip"] }

[lints]
workspace = true
