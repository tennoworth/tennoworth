[package]
name = "market-domain-web"
version = "0.1.0"
edition = "2021"
description = "The synchronous view rules of market-domain, compiled for the site and the desktop webview."
license = "MIT"
publish = false

[lib]
# cdylib is the wasm32 module the views load; rlib lets the host suite test it.
crate-type = ["cdylib", "rlib"]

[dependencies]
market-domain = { path = "../market-domain" }
# Requests carry the page's numbers as JSON.stringify printed them, the
# shortest text that reads back to the same double; the default parser can
# land one unit in the last place away, and a view rule then disagrees with
# the number on screen.
serde_json = { workspace = true, features = ["float_roundtrip"] }

[lints]
workspace = true
