<!doctype html>
<!-- Source for the GitHub repository social preview (Settings > Social preview).
     Render from frontend/ with:
       bunx playwright screenshot --browser chromium --viewport-size "1280, 640"
         --wait-for-timeout 800 file://$PWD/../.github/social-preview/card.html
         ../.github/social-preview/card.png
     GitHub crops the outer
     80px (40pt at 2x) on some surfaces, so everything readable stays inside it.
     Colors are the yorha dark ("Oil & Rag") values from frontend/src/app.css. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>TennoWorth social preview</title>
<style>
  @font-face { font-family: "Archivo Narrow"; src: url("../../frontend/public/fonts/archivo-narrow-var-latin.woff2") format("woff2"); font-weight: 400 700; }
  @font-face { font-family: "IBM Plex Sans"; src: url("../../frontend/public/fonts/ibm-plex-sans-var-latin.woff2") format("woff2"); font-weight: 100 700; }
  :root {
    --bg: #1E1913; --panel-2: #342D23; --fg: #D3C7A6; --muted: #A3977A;
    --faint: #8A7F66; --grid: rgba(211, 199, 166, 0.07);
    --font-ui: "Archivo Narrow", sans-serif; --font-body: "IBM Plex Sans", sans-serif;
  }
  html, body { margin: 0; }
  body {
    width: 1280px; height: 640px; overflow: hidden; position: relative;
    background-color: var(--bg);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px; background-position: 0 0;
    color: var(--fg);
  }
  .head {
    position: absolute; left: 80px; right: 80px; top: 80px; height: 340px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .mark { width: 128px; height: 128px; color: var(--fg); }
  h1 {
    margin: 28px 0 0; font: 500 104px/1 var(--font-ui);
    letter-spacing: 0.18em; text-transform: uppercase;
    margin-right: -0.18em;
  }
  .tag { margin: 22px 0 0; font: 400 36px/1.2 var(--font-body); }
  .rail {
    position: absolute; left: 0; right: 0; top: 460px; height: 100px;
    background: var(--panel-2); border-top: 2px solid var(--fg);
    display: flex; align-items: center; justify-content: center; gap: 28px;
    font: 600 26px/1 var(--font-ui); letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted);
  }
  .rail .dot { color: var(--faint); }
</style>
</head>
<body>
  <div class="head">
    <svg class="mark" viewBox="4 4 56 56" aria-hidden="true">
      <path d="M22.5 15.546 27.25 7.318H36.75L41.5 15.546H51L55.75 23.773 51 32l4.75 8.227L51 48.454h-9.5l-4.75 8.228h-9.5l-4.75-8.228H13l-4.75-8.227L13 32 8.25 23.773 13 15.546Z" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linejoin="bevel"/>
      <path d="M41.5 32 36.75 40.227H27.25L22.5 32l4.75-8.227h9.5ZM41.5 15.546l-4.75 8.227m-9.5 0-4.75-8.227M51 32h-9.5m0 16.454-4.75-8.227m-14.25 8.227 4.75-8.227M13 32h9.5" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="square" stroke-linejoin="miter"/>
      <path d="M32 28.6 34.944 30.3v3.4L32 35.4l-2.944-1.7v-3.4Z" fill="currentColor"/>
    </svg>
    <h1>TennoWorth</h1>
    <p class="tag">What to sell in Warframe, right now.</p>
  </div>
  <div class="rail">
    <span>Windows + Linux</span><span class="dot">·</span>
    <span>No Overwolf</span><span class="dot">·</span>
    <span>Prices from warframe.market</span>
  </div>
</body>
</html>
