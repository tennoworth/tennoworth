name: ui-smoke

# Runs the REAL desktop app (Tauri v2, Windows) under the TENNOWORTH_PROBE
# harness on desktop-affecting pull requests and once weekly: the probe injects
# a synthetic fixture, drives the scan -> sell view -> listing UI over real IPC,
# and writes its evidence
# (console errors, CSP violations, mount state) to a JSON report that
# scripts/check-probe-report.ts gates on. This is the only gate that catches
# "builds fine, feature silently no-ops" - the 2026-08-03 default-vs-named
# import bug passed bun run check, svelte-check AND knip.
#
# Linux uses the same probe under Xvfb with an isolated D-Bus session.

on:
  pull_request:
  schedule:
    # Keeps a default-branch vcpkg cache available to pull requests. PR-created
    # caches are scoped to their merge ref and cannot seed later PRs.
    - cron: '47 5 * * 1'
  workflow_dispatch:
    inputs:
      cache-namespace:
        description: Optional isolated Windows cache namespace for benchmarks
        required: false
        default: ''
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  # Keep the workflow present for every PR: job-level skipping still produces a
  # completed required gate, unlike workflow-level path filters.
  changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            desktop:
              - 'rust/Cargo.lock'
              - 'rust/Cargo.toml'
              - 'rust/tennoworth-desktop/**'
              - 'rust/wfm-client/**'
              - 'rust/market-math/**'
              - 'rust/wfm-core/**'
              - 'frontend/src/**'
              - 'tests/fixtures/relic-ocr/**'
              - 'frontend/index.html'
              - 'frontend/bun.lock'
              - 'frontend/package.json'
              - 'frontend/svelte.config.ts'
              - 'frontend/tsconfig.json'
              - 'frontend/vite.config.ts'
              - 'frontend/public/theme-boot.js'
              - 'frontend/public/market.json'
              - 'frontend/public/wfstat-catalog.json'
              - 'frontend/public/definitions.json'
              - 'scripts/probe-smoke-linux.sh'
              - 'scripts/check-probe-report.ts'
              - 'scripts/probe-readiness.test.ts'
              - 'scripts/sync-csp.ts'
              - '.github/actions/setup-rust/**'
              - '.github/actions/setup-windows-ocr/**'
              - '.github/workflows/ui-smoke.yml'

  probe-smoke:
    needs: changes
    if: >-
      needs.changes.outputs.desktop == 'true' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@v2

      - name: Probe readiness regression
        run: bun test scripts/probe-readiness.test.ts

      - uses: ./.github/actions/setup-windows-ocr
        id: windows-ocr
        with:
          cache-namespace: ${{ inputs.cache-namespace }}

      - uses: ./.github/actions/setup-rust
        with:
          shared-key: windows-desktop-release-${{ steps.windows-ocr.outputs.compatibility-key }}

      - name: Stage pinned OCR model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rust/tennoworth-desktop/resources/tessdata
          curl --fail --location --retry 3 \
            https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/eng.traineddata \
            --output rust/tennoworth-desktop/resources/tessdata/eng.traineddata
          echo '7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2  rust/tennoworth-desktop/resources/tessdata/eng.traineddata' | sha256sum --check

      # The desktop binary embeds the SPA at compile time (frontendDist) and
      # plain `cargo build` does not run tauri.conf.json's beforeBuildCommand
      # the way `tauri build` does - build the frontend explicitly first.
      - name: Build frontend (dist-desktop)
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run build:desktop

      - name: Build the desktop app
        working-directory: rust
        run: cargo build --release -p tennoworth-desktop

      - name: Real three-reward OCR regression
        working-directory: rust
        run: >-
          cargo test --release -p tennoworth-desktop
          real_three_reward_capture_survives_common_display_shapes -- --ignored

      # The probe auto-exits after the FINAL report; a hang is a probe bug and
      # gets killed by the step timeout. The report is written twice (checkpoint
      # + FINAL), so the file read afterwards is the complete run.
      #
      # 2026-08-13: the first runs failed because the probe env vars in this
      # workflow used TENOWORTH_* (one N) while the app reads TENNOWORTH_* (two Ns,
      # the TennoWorth spelling) - probe mode never activated, the app ran as a
      # normal GUI app, and the step timed out. Fixed in cb39d75. WEBVIEW2_USER_
      # DATA_FOLDER is kept as standard CI hygiene (a writable user-data folder
      # never hurts and avoids the default-folder edge cases); the app also adds
      # probe-only Chromium flags when the probe is active (main.rs).
      - name: Run the app under the probe
        shell: pwsh
        env:
          TENNOWORTH_PROBE: '1'
          TENNOWORTH_PROBE_OUT: '${{ runner.temp }}\probe-report.json'
          TENNOWORTH_JWT_PATH: '${{ runner.temp }}\wfm-jwt.enc'
          TENNOWORTH_PENDING_PATH: '${{ runner.temp }}\pending-plan.json'
          WEBVIEW2_USER_DATA_FOLDER: '${{ runner.temp }}\webview2-data'
        timeout-minutes: 5
        run: |
          & .\rust\target\release\tennoworth-desktop.exe 2>&1 |
            Tee-Object -FilePath "${{ runner.temp }}\probe-stdout.log"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "app exited with $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Get-Content "${{ runner.temp }}\probe-stdout.log" | Select-String -Pattern 'PROBE_REPORT_BEGIN FINAL' | Select-Object -First 1

      - name: Assert the probe report
        run: bun scripts/check-probe-report.ts "${{ runner.temp }}\probe-report.json"

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-evidence
          path: |
            ${{ runner.temp }}/probe-report.json
            ${{ runner.temp }}/probe-stdout.log
          if-no-files-found: ignore

  probe-smoke-linux:
    needs: changes
    if: >-
      needs.changes.outputs.desktop == 'true' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Probe readiness regression
        run: bun test scripts/probe-readiness.test.ts
      - name: Identify runner image
        id: runner-image
        shell: bash
        run: echo "version=${ImageVersion:?Runner image version is required}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-rust
        with:
          shared-key: linux-ubuntu-22.04-debug-${{ steps.runner-image.outputs.version }}
      - name: Install native build and display dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev libtesseract-dev libleptonica-dev libxcb1-dev
          libwayland-dev libxkbcommon-dev xvfb xauth dbus-x11
      - name: Stage pinned OCR model
        run: |
          set -euo pipefail
          mkdir -p rust/tennoworth-desktop/resources/tessdata
          curl --fail --location --retry 3 \
            https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/eng.traineddata \
            --output rust/tennoworth-desktop/resources/tessdata/eng.traineddata
          echo '7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2  rust/tennoworth-desktop/resources/tessdata/eng.traineddata' | sha256sum --check
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Build and run the Linux desktop probe
        env:
          TENNOWORTH_PROBE_EVIDENCE_DIR: '${{ runner.temp }}/probe-linux'
        run: bash scripts/probe-smoke-linux.sh
      - name: Upload Linux probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-evidence-linux
          path: ${{ runner.temp }}/probe-linux/
          if-no-files-found: ignore

  # The required status for this workflow. A skipped probe is intentional for
  # unrelated changes; a failed or cancelled relevant probe blocks promotion.
  ui-gate:
    if: ${{ always() }}
    needs: [changes, probe-smoke, probe-smoke-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Require the applicable probe to pass
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS" | jq .
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
