name: ui-smoke

# Runs the REAL desktop app (Tauri v2, Windows) under the TENNOWORTH_PROBE
# harness on desktop-affecting pull requests and once weekly: the probe injects
# a synthetic fixture, drives the scan -> sell view -> listing UI over real IPC,
# and writes its evidence
# (console errors, CSP violations, mount state) to a JSON report that
# scripts/check-probe-report.ts gates on. This is the only gate that catches
# "builds fine, feature silently no-ops" - the 2026-08-03 default-vs-named
# import bug passed bun run check, svelte-check AND knip.
#
# Linux is not smoke-tested here: the same run would need xvfb-run or a
# headless WebKitGTK setup (fragile, and the memory scan is Windows-only
# territory anyway). Windows runs the app in its native session, so the probe
# needs no display tricks - this is the cheapest faithful E2E signal.

on:
  pull_request:
  schedule:
    # Keeps a default-branch vcpkg cache available to pull requests. PR-created
    # caches are scoped to their merge ref and cannot seed later PRs.
    - cron: '47 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # Keep the workflow present for every PR: job-level skipping still produces a
  # completed required gate, unlike workflow-level path filters.
  changes:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            desktop:
              - 'companion/Cargo.lock'
              - 'companion/Cargo.toml'
              - 'companion/tennoworth-desktop/**'
              - 'companion/wfm-client/**'
              - 'companion/wfm-core/**'
              - 'prototype/src/**'
              - 'tests/fixtures/relic-ocr/**'
              - 'prototype/index.html'
              - 'prototype/bun.lock'
              - 'prototype/package.json'
              - 'prototype/svelte.config.ts'
              - 'prototype/tsconfig.json'
              - 'prototype/vite.config.ts'
              - 'prototype/public/theme-boot.js'
              - 'scripts/check-probe-report.ts'
              - 'scripts/sync-csp.ts'
              - '.github/actions/setup-rust/**'
              - '.github/workflows/ui-smoke.yml'

  probe-smoke:
    needs: changes
    if: >-
      needs.changes.outputs.desktop == 'true' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-binary-cache,readwrite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@v2

      - uses: ./.github/actions/setup-rust

      - name: Identify hosted vcpkg installation
        id: vcpkg
        shell: pwsh
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) { throw 'GitHub runner vcpkg installation was not found' }
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $commit = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not identify the hosted vcpkg revision' }
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "image-version=$env:ImageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # vcpkg's former x-gha backend was removed. Use its stable files backend
      # behind GitHub's cache action instead; ABI hashes still decide whether a
      # restored package is compatible with this compiler and port revision.
      - name: Restore vcpkg binary packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}\vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ steps.vcpkg.outputs.commit }}-${{ steps.vcpkg.outputs.image-version }}

      - name: Install overlay OCR build dependencies
        shell: bash
        run: |
          set -euo pipefail
          vcpkg install tesseract:x64-windows-static-md
          mkdir -p companion/tennoworth-desktop/resources/tessdata
          curl --fail --location --retry 3 \
            https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/eng.traineddata \
            --output companion/tennoworth-desktop/resources/tessdata/eng.traineddata
          echo '7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2  companion/tennoworth-desktop/resources/tessdata/eng.traineddata' | sha256sum --check

      # The desktop binary embeds the SPA at compile time (frontendDist) and
      # plain `cargo build` does not run tauri.conf.json's beforeBuildCommand
      # the way `tauri build` does - build the frontend explicitly first,
      # exactly like release-desktop.yml does.
      - name: Build frontend (dist-desktop)
        working-directory: prototype
        run: |
          bun install --frozen-lockfile
          bun run build:desktop

      - name: Build the desktop app
        working-directory: companion
        run: cargo build --release -p tennoworth-desktop

      - name: Real three-reward OCR regression
        working-directory: companion
        run: >-
          cargo test --release -p tennoworth-desktop
          real_three_reward_capture_survives_common_display_shapes -- --ignored

      # The probe auto-exits after the FINAL report; a hang is a probe bug and
      # gets killed by the step timeout. The report is written twice (checkpoint
      # + FINAL), so the file read afterwards is the complete run.
      #
      # 2026-08-13: the first runs failed because the probe env vars in this
      # workflow used TENOWORTH_* (one N) while the app reads TENNOWORTH_* (two Ns,
      # the TennoWorth spelling) - probe mode never activated, the app ran as a
      # normal GUI app, and the step timed out. Fixed in cb39d75. WEBVIEW2_USER_
      # DATA_FOLDER is kept as standard CI hygiene (a writable user-data folder
      # never hurts and avoids the default-folder edge cases); the app also adds
      # probe-only Chromium flags when the probe is active (main.rs).
      - name: Run the app under the probe
        shell: pwsh
        env:
          TENNOWORTH_PROBE: '1'
          TENNOWORTH_PROBE_OUT: '${{ runner.temp }}\probe-report.json'
          WEBVIEW2_USER_DATA_FOLDER: '${{ runner.temp }}\webview2-data'
        timeout-minutes: 5
        run: |
          & .\companion\target\release\tennoworth-desktop.exe 2>&1 |
            Tee-Object -FilePath "${{ runner.temp }}\probe-stdout.log"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "app exited with $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Get-Content "${{ runner.temp }}\probe-stdout.log" | Select-String -Pattern 'PROBE_REPORT_BEGIN FINAL' | Select-Object -First 1

      - name: Assert the probe report
        run: bun scripts/check-probe-report.ts "${{ runner.temp }}\probe-report.json"

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: probe-evidence
          path: |
            ${{ runner.temp }}/probe-report.json
            ${{ runner.temp }}/probe-stdout.log
          if-no-files-found: ignore

  # The required status for this workflow. A skipped probe is intentional for
  # unrelated changes; a failed or cancelled relevant probe blocks promotion.
  ui-gate:
    if: ${{ always() }}
    needs: [changes, probe-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Require the applicable probe to pass
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS" | jq .
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
