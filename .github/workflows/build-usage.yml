name: build-usage

# Publish the isolated opt-in counting service from production.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/collector-build.yml
    with:
      crate: tennoworth-usage
      caller: build-usage.yml
      tag: usage-latest
      body: Rolling build of the opt-in daily installation counter from main.
