name: build-web

# Build the static prototype/dist/ off the exposed box (node/bun never touch
# it - see the deploy runbook "Build supply-chain"). Publishes a rolling
# `web-latest` release asset the deploy box pulls with a plain curl, no auth,
# no Tailscale/LAN transfer needed - matches release-desktop.yml's pattern.

on:
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - '.github/workflows/build-web.yml'
      - '.github/actions/publish-rolling-release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@v2

      # This publisher owns its test/build verdict: audit.yml does not run on
      # main pushes, and a deployable artifact must be validated in the workflow
      # that produces it.
      - name: Install, test, build
        working-directory: prototype
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run build

      - name: Package
        run: tar -C prototype/dist -czf dist.tgz .

      - name: Publish rolling release
        uses: ./.github/actions/publish-rolling-release
        with:
          tag_name: web-latest
          release_name: web-latest (auto-built)
          files: dist.tgz
          body: Rolling build of prototype/dist from the latest main. Not a version release - see the desktop-v* tags for the desktop app.
