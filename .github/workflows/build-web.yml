name: build-web

# Build the static frontend/dist/ off the exposed box (node/bun never touch
# it - see the deploy runbook "Build supply-chain"). Publishes a rolling
# `web-latest` release asset the deploy box pulls with a plain curl, no auth,
# no Tailscale/LAN transfer needed - matches release-desktop.yml's pattern.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-web.yml'
      - '.github/actions/publish-rolling-release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@v2

      # Several hundred MB of browsers re-downloaded on every main push.
      # Keyed on the lockfile, which pins the Playwright version. This workflow
      # only runs on main and manual dispatch, so there is no pull request to
      # keep restore-only.
      - name: Cache responsive-test browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/bun.lock') }}

      # This publisher owns its test/build verdict: audit.yml does not run on
      # main pushes, and a deployable artifact must be validated in the workflow
      # that produces it.
      - name: Install, test, build
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium webkit
          bun run test
          bun run test:responsive:all
          bun run build

      - name: Upload responsive failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: responsive-test-evidence
          path: frontend/test-results/responsive
          if-no-files-found: ignore

      - name: Package
        run: tar -C frontend/dist -czf dist.tgz .

      - name: Publish rolling release
        uses: ./.github/actions/publish-rolling-release
        with:
          tag_name: web-latest
          release_name: web-latest (auto-built)
          files: dist.tgz
          body: Rolling build of frontend/dist from the latest main. Not a version release - see the desktop-v* tags for the desktop app.
