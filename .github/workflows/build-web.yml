name: build-web

# Build the static frontend/dist/ off the exposed box (node/bun never touch
# it - see the deploy runbook "Build supply-chain"). Publishes a rolling
# `web-latest` release asset the deploy box pulls with a plain curl, no auth,
# no Tailscale/LAN transfer needed - matches release-desktop.yml's pattern.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The input list used to sit on `on.push`, which is the wrong place for a
  # publisher. GitHub evaluates only the first 300 files of a diff: a promotion
  # large enough to push the frontend files past that window would leave this
  # workflow not running at all, and production silently serving the previous
  # bundle. A workflow that never starts also leaves no trace to notice. Moving
  # the decision into a job keeps the whole diff and makes a skip a visible
  # skipped job.
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # The default `some` quantifier ORs the patterns independently, so the
          # markdown exclusion below would match every other path instead of
          # excluding it.
          predicate-quantifier: 'some-with-excludes'
          list-files: json
          filters: |
            build:
              - 'frontend/**'
              - '!**/*.md'
              - '.github/workflows/build-web.yml'
              - '.github/actions/publish-rolling-release/**'
            changed:
              - '**'

      # `build` is the closed set of inputs to the bundle, not a fail-closed net:
      # an unrelated change - a Rust-only promotion - must not republish the
      # site, so a new input has to be added to the list above. The exception is
      # a diff the action could not read at all, which is an anomaly rather than
      # "nothing happened". Manual dispatch always publishes, because it is the
      # recovery path for a bundle that did not update on its own.
      - name: Publish only when the bundle's inputs changed
        id: decide
        env:
          RESULTS: ${{ toJson(steps.filter.outputs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          build=$(echo "$RESULTS" | jq -r '.build')
          changed=$(echo "$RESULTS" | jq -r '.changed_files | fromjson | length')
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$build" = "true" ] || [ "$changed" = "0" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "No input to the web bundle changed; leaving web-latest as it is."
          fi

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@v2

      # Several hundred MB of browsers re-downloaded on every main push.
      # Keyed on the lockfile, which pins the Playwright version. This workflow
      # only runs on main and manual dispatch, so there is no pull request to
      # keep restore-only.
      - name: Cache responsive-test browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/bun.lock') }}

      # This publisher owns its test/build verdict: audit.yml does not run on
      # main pushes, and a deployable artifact must be validated in the workflow
      # that produces it.
      - name: Install, test, build
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium webkit
          bun run test
          bun run test:responsive:all
          bun run build

      - name: Upload responsive failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: responsive-test-evidence
          path: frontend/test-results/responsive
          if-no-files-found: ignore

      - name: Package
        run: tar -C frontend/dist -czf dist.tgz .

      - name: Publish rolling release
        uses: ./.github/actions/publish-rolling-release
        with:
          tag_name: web-latest
          release_name: web-latest (auto-built)
          files: dist.tgz
          body: Rolling build of frontend/dist from the latest main. Not a version release - see the desktop-v* tags for the desktop app.
