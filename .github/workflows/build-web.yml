name: build-web

# Build the static prototype/dist/ off the exposed box (node/bun never touch
# it — see the deploy runbook "Build supply-chain"). Publishes a rolling
# `web-latest` release asset the deploy box pulls with a plain curl, no auth,
# no Tailscale/LAN transfer needed — matches release-desktop.yml's pattern.

on:
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - '.github/workflows/build-web.yml'
      - '.github/actions/publish-rolling-release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@v2

      # Yes, audit.yml also runs these on the same push. Kept deliberately: this
      # job publishes the artifact the deploy box pulls, and it must not depend
      # on a sibling job's verdict to decide whether that artifact is sound. The
      # duplicate costs ~30 s in a parallel job; coupling the two workflows to
      # save it would make a publish gate that can go green on its own.
      - name: Install, test, build
        working-directory: prototype
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run build

      - name: Package
        run: tar -C prototype/dist -czf dist.tgz .

      - name: Publish rolling release
        uses: ./.github/actions/publish-rolling-release
        with:
          tag_name: web-latest
          release_name: web-latest (auto-built)
          files: dist.tgz
          body: Rolling build of prototype/dist from the latest main. Not a version release — see the desktop-v* tags for the desktop app.
