name: build-scrape

# Build the host-only wfm-scrape pipeline binary whenever it (or a crate it
# depends on) changes, and publish it as a rolling `scrape-latest` release the
# deploy box pulls with a plain curl, no auth — matches build-web.yml's shape.
# This is NOT the desktop app (that ships on tag desktop-v* via
# release-desktop.yml); it runs the converter SHADOW on the box (phase 2b),
# journaling parity with the Python converter without ever touching production.

on:
  push:
    branches: [main]
    paths:
      - 'companion/wfm-scrape/**'
      - 'companion/wfm-client/**'
      - 'companion/market-math/**'
      - 'companion/Cargo.toml'
      - 'companion/Cargo.lock'
      - '.github/workflows/build-scrape.yml'
      - '.github/actions/setup-rust/**'
      - '.github/actions/publish-rolling-release/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # ubuntu-22.04 for its glibc 2.35 — same rationale as release-desktop.yml's
    # linux-binary job (backward- but no forward-compat).
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust

      - name: Build
        run: cargo build --release -p wfm-scrape

      - name: Package + checksum
        run: |
          mkdir -p ../dist
          cp target/release/wfm-scrape ../dist/wfm-scrape
          cd ../dist
          sha256sum wfm-scrape > wfm-scrape.sha256
          cat wfm-scrape.sha256

      - name: Publish rolling release
        uses: ./.github/actions/publish-rolling-release
        with:
          tag_name: scrape-latest
          release_name: scrape-latest (auto-built)
          files: |
            dist/wfm-scrape
            dist/wfm-scrape.sha256
          body: Rolling build of the host-only wfm-scrape pipeline binary from the latest main. Auto-built; runs the converter shadow on the deploy box (phase 2b), not production. Not a version release — see the desktop-v* tags for the desktop app.
