name: audit

# Runs the full applicable gate set on pull requests, weekly, and on demand.
# Main/develop pushes already passed these checks as pull requests; deployment
# workflows remain responsible for producing artifacts from main.

on:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'  # every Monday at 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # A skipped job reports success, while a skipped workflow can leave a
  # required check permanently pending. Classify inside the workflow so every
  # PR still gets a completed gate, but irrelevant builds never start.
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend_runtime: ${{ steps.filter.outputs.frontend_runtime }}
      frontend_deps: ${{ steps.filter.outputs.frontend_deps }}
      rust_code: ${{ steps.filter.outputs.rust_code }}
      rust_deps: ${{ steps.filter.outputs.rust_deps }}
      rust_audit: ${{ steps.filter.outputs.rust_audit }}
      market_data: ${{ steps.filter.outputs.market_data }}
      deploy: ${{ steps.filter.outputs.deploy }}
      version: ${{ steps.filter.outputs.version }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend_runtime:
              - 'prototype/src/**'
              - 'prototype/index.html'
              - 'prototype/knip.jsonc'
              - 'prototype/svelte.config.ts'
              - 'prototype/tsconfig.json'
              - 'prototype/vite.config.ts'
              - 'prototype/vitest.config.ts'
              - 'prototype/public/theme-boot.js'
              - 'scripts/sync-csp.ts'
              - 'tests/fixtures/**'
            frontend_deps:
              - 'prototype/package.json'
              - 'prototype/bun.lock'
            rust_code:
              - 'companion/**'
              - '!companion/Cargo.lock'
              - '!companion/Cargo.toml'
              - '!companion/**/Cargo.toml'
              - '!companion/.cargo/audit.toml'
              - 'tests/fixtures/**'
            rust_deps:
              - 'companion/Cargo.lock'
              - 'companion/Cargo.toml'
              - 'companion/**/Cargo.toml'
            rust_audit:
              - 'companion/.cargo/audit.toml'
            market_data:
              - 'prototype/public/market.json'
              - 'prototype/public/wfstat-catalog.json'
              - 'prototype/public/definitions.json'
              - 'wfm_results.csv'
              - 'scripts/release.ts'
              - 'scripts/release.test.ts'
            deploy:
              - 'deploy/**'
              - 'prototype/index.html'
              - 'prototype/public/_headers'
              - 'scripts/*.sh'
              - 'scripts/sync-csp.ts'
            version:
              - 'companion/Cargo.lock'
              - 'companion/tennoworth-desktop/Cargo.toml'
              - 'CHANGELOG.md'
              - 'scripts/release.ts'
              - 'scripts/release.test.ts'
              - '.github/workflows/release-desktop.yml'
            ci:
              - '.github/workflows/**'
              - '.github/actions/**'

  frontend-check:
    needs: changes
    if: >-
      needs.changes.outputs.frontend_runtime == 'true' ||
      needs.changes.outputs.frontend_deps == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: tests
        run: bun run test
      - name: type-check
        run: bunx svelte-check --threshold error
      # Dead exports. Neither gate above can see them: noUnusedLocals flags
      # locals not exports, and svelte-check skips @ts-nocheck files.
      - name: dead-export check
        run: bun run knip
      - name: build
        run: bun run build

  bun-audit:
    needs: changes
    if: >-
      needs.changes.outputs.frontend_deps == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: bun audit (moderate+)
        run: bun audit --prod --audit-level=moderate

  cargo-audit:
    needs: changes
    if: >-
      needs.changes.outputs.rust_deps == 'true' ||
      needs.changes.outputs.rust_audit == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      # Reads as an expensive from-source build and isn't: Swatinem/rust-cache
      # in setup-rust caches ~/.cargo/bin, so this resolves as already-installed.
      # Measured on run 30705176923 - 0 s for this step, 23 s for the whole job.
      # Don't "optimize" it into a prebuilt-binary action without re-measuring.
      - name: Install cargo-audit (cached by setup-rust)
        run: cargo install --locked cargo-audit
      - name: cargo audit
        run: cargo audit --deny warnings

  cargo-shear:
    needs: changes
    if: >-
      needs.changes.outputs.rust_deps == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Install cargo-shear (cached by setup-rust)
        run: cargo install --locked cargo-shear
      - name: cargo shear
        run: cargo shear

  cargo-test:
    needs: changes
    if: >-
      needs.changes.outputs.rust_code == 'true' ||
      needs.changes.outputs.rust_deps == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      # Cargo.lock is part of what ships, not a local cache: anyone building
      # the tag from source runs `cargo build --frozen`, which aborts rather
      # than rewrite the lock. Every build in this repo has network access and
      # quietly re-resolves it instead, so a version bump that edits Cargo.toml
      # alone is green here and wrong in the tag - how 0.3.5 and 0.3.6 both
      # shipped unbuildable from source. Dependency and release-metadata
      # changes run this before compiling the workspace.
      - name: Gate - Cargo.lock already matches the manifests
        if: >-
          needs.changes.outputs.rust_deps == 'true' ||
          needs.changes.outputs.ci == 'true' ||
          github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: cargo fetch --locked
      # tennoworth-desktop (Tauri v2) links the Linux GUI stack; without these
      # -dev packages the *-sys crates fail at pkg-config and the whole
      # workspace test run dies before a single test executes.
      - name: Install Tauri Linux deps
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev libtesseract-dev libleptonica-dev libxcb1-dev patchelf
      # Covers the retired Python parity gates: wfm-scrape's fixture integration
      # tests (companion/wfm-scrape/tests/) shell the freshly-built binary against
      # the frozen fixtures. cargo rebuilds the binary before they run, so a
      # stale artifact cannot green them.
      - name: cargo test
        run: cargo test

  # The desktop version is pinned in two places (Cargo.toml and Cargo.lock's
  # own entry). Until this job existed the only thing that checked
  # them was the release workflow, so drift was discovered while shipping:
  # package.json sat at 0.3.3 under a 0.3.6 desktop for three releases, and
  # 0.3.5 and 0.3.6 both shipped a Cargo.lock naming the previous version -
  # unbuildable from source, because a --frozen build never rewrites a lock.
  #
  # Same script the release's preflight runs, minus --release: on a PR the repo
  # legitimately sits AT the newest published version between releases, so only
  # "behind" is drift. When the version advances, it also requires the complete
  # structured release-note contract before the preparation PR can merge.
  version-pins:
    needs: changes
    if: >-
      needs.changes.outputs.version == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Version pins and release notes agree
        run: bun scripts/release.ts check

  # companion/Cargo.toml denies the crash-prone Clippy family workspace-wide.
  # Test panics are allowed by clippy.toml; impossible production paths carry
  # a narrow allow with the invariant beside the code.
  cargo-clippy:
    needs: changes
    if: >-
      needs.changes.outputs.rust_code == 'true' ||
      needs.changes.outputs.rust_deps == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Install Tauri Linux deps
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev libtesseract-dev libleptonica-dev libxcb1-dev patchelf
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

  market-data:
    needs: changes
    if: >-
      needs.changes.outputs.market_data == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Snapshot validator tests
        run: bun test scripts/release.test.ts
      - name: Validate committed data
        run: |
          bun scripts/release.ts snapshot-check
          jq -e 'type == "object"' prototype/public/definitions.json

  deploy-validation:
    needs: changes
    if: >-
      needs.changes.outputs.deploy == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Shell syntax
        run: |
          for script in deploy/*.sh scripts/*.sh; do
            bash -n "$script"
          done
      - name: systemd unit syntax
        run: |
          sudo install -d -m 0755 /srv/wfm/app
          sudo install -m 0755 deploy/*.sh /srv/wfm/
          systemd-analyze verify deploy/*.service deploy/*.timer
      - name: CSP copies agree
        run: bun scripts/sync-csp.ts --check
      - name: Install Caddy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends caddy
      - name: Caddyfile syntax
        run: caddy validate --config deploy/Caddyfile --adapter caddyfile

  # This is the required audit status. It runs even when a prerequisite is
  # skipped and fails only when a relevant job failed or was cancelled.
  audit-gate:
    if: ${{ always() }}
    needs:
      - changes
      - frontend-check
      - bun-audit
      - cargo-audit
      - cargo-shear
      - cargo-test
      - cargo-clippy
      - version-pins
      - market-data
      - deploy-validation
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable check to pass
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS" | jq .
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
