name: audit

# Runs the full applicable gate set on pull requests, weekly, and on demand.
# Deployment workflows remain responsible for producing artifacts from main.
#
# The develop trigger is not here to re-validate a merge - the pull request
# already ran against the same tree. It is here because a cache only counts for
# a pull request when it lives on the default branch, and rust-cache folds the
# Cargo manifests into its key. Measured 2026-09-13: with only the weekly cron
# seeding develop, Cargo.lock changes on Sep 8, 9 and 11 each rotated every Rust
# cache key and every subsequent pull request logged "No cache found" - cargo
# test 5m54s instead of 2m49s, cargo-audit 3m11s instead of 0m10s. The paths
# filter keeps this to merges that can actually rotate a cached key.
on:
  pull_request:
  push:
    branches: [develop]
    paths:
      - 'rust/Cargo.lock'
      - 'rust/Cargo.toml'
      - 'rust/**/Cargo.toml'
      - 'frontend/bun.lock'
      - 'frontend/package.json'
      - '.github/actions/setup-rust/**'
      - '.github/workflows/audit.yml'
  schedule:
    - cron: '17 4 * * 1'  # every Monday at 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  # A skipped job reports success, while a skipped workflow can leave a
  # required check permanently pending. Classify inside the workflow so every
  # PR still gets a completed gate, but irrelevant builds never start.
  changes:
    runs-on: ubuntu-latest
    outputs:
      # Every filter output carries the unclassified term, so a change no filter
      # recognizes makes every surface applicable without repeating that OR in
      # nine separate job conditions.
      frontend_runtime: ${{ steps.filter.outputs.frontend_runtime == 'true' || steps.unclassified.outputs.value == 'true' }}
      frontend_deps: ${{ steps.filter.outputs.frontend_deps == 'true' || steps.unclassified.outputs.value == 'true' }}
      rust_code: ${{ steps.filter.outputs.rust_code == 'true' || steps.unclassified.outputs.value == 'true' }}
      rust_deps: ${{ steps.filter.outputs.rust_deps == 'true' || steps.unclassified.outputs.value == 'true' }}
      rust_audit: ${{ steps.filter.outputs.rust_audit == 'true' || steps.unclassified.outputs.value == 'true' }}
      market_data: ${{ steps.filter.outputs.market_data == 'true' || steps.unclassified.outputs.value == 'true' }}
      deploy: ${{ steps.filter.outputs.deploy == 'true' || steps.unclassified.outputs.value == 'true' }}
      version: ${{ steps.filter.outputs.version == 'true' || steps.unclassified.outputs.value == 'true' }}
      ci: ${{ steps.filter.outputs.ci == 'true' || steps.unclassified.outputs.value == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend_runtime:
              - 'frontend/src/**'
              - 'frontend/index.html'
              - 'frontend/knip.jsonc'
              - 'frontend/svelte.config.ts'
              - 'frontend/tsconfig.json'
              - 'frontend/vite.config.ts'
              - 'frontend/vitest.config.ts'
              - 'frontend/playwright.config.ts'
              - 'frontend/tests/browser/**'
              - 'frontend/public/theme-boot.js'
              - 'scripts/sync-csp.ts'
              - 'tests/fixtures/**'
            frontend_deps:
              - 'frontend/package.json'
              - 'frontend/bun.lock'
            rust_code:
              - 'rust/**'
              - '!rust/Cargo.lock'
              - '!rust/Cargo.toml'
              - '!rust/**/Cargo.toml'
              - '!rust/.cargo/audit.toml'
              - 'tests/fixtures/**'
            rust_deps:
              - 'rust/Cargo.lock'
              - 'rust/Cargo.toml'
              - 'rust/**/Cargo.toml'
            rust_audit:
              - 'rust/.cargo/audit.toml'
            market_data:
              - 'frontend/public/market.json'
              - 'frontend/public/wfstat-catalog.json'
              - 'frontend/public/definitions.json'
              - 'wfm_results.csv'
              - 'scripts/release.ts'
              - 'scripts/release.test.ts'
            deploy:
              - 'deploy/**'
              - 'frontend/index.html'
              - 'frontend/public/_headers'
              - 'scripts/*.sh'
              - 'scripts/deploy-layout.test.ts'
              - 'scripts/sync-csp.ts'
            version:
              - 'rust/Cargo.lock'
              - 'rust/tennoworth-desktop/Cargo.toml'
              - 'CHANGELOG.md'
              - 'scripts/release.ts'
              - 'scripts/release.test.ts'
              - '.github/workflows/release-desktop.yml'
            ci:
              - '.github/workflows/**'
              - '.github/actions/**'
            docs_only:
              - '**/*.md'
              - 'docs/**'

      # A path no filter recognizes must count as affecting everything, not as
      # affecting nothing. dorny/paths-filter reports false for files it was
      # never told about, and audit-gate counts an all-skipped run as success, so
      # an unlisted new file (a fresh scripts/*.ts, an extra frontend/public
      # asset, a new top-level directory) could otherwise merge with zero checks
      # executed. Documentation-only changes stay exempt, which is what
      # CONTRIBUTING.md promises for them.
      - name: Treat unclassified changes as affecting every surface
        id: unclassified
        env:
          RESULTS: ${{ toJson(steps.filter.outputs) }}
        run: |
          set -euo pipefail
          code=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.key != "docs_only") | select(.value == "true")] | length')
          docs=$(echo "$RESULTS" | jq -r '.docs_only')
          if [ "$code" = "0" ] && [ "$docs" != "true" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
            echo "No path filter matched and this is not a documentation-only change; every gate will run."
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

  frontend-check:
    needs: changes
    if: >-
      needs.changes.outputs.frontend_runtime == 'true' ||
      needs.changes.outputs.frontend_deps == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Several hundred MB of browser downloads that setup-bun does not cover.
      # Keyed on the lockfile, which is what pins the Playwright version, and
      # restore-only on pull requests for the same scope reason setup-rust
      # documents. Reaches the cache through the develop trigger only.
      - name: Restore responsive-test browsers
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frontend/bun.lock') }}
      - name: Install responsive-test browsers
        run: bunx playwright install --with-deps chromium webkit
      - name: Save responsive-test browsers
        if: github.event_name != 'pull_request' && steps.playwright-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: tests
        run: bun run test
      - name: responsive browser gate
        run: bun run test:responsive:all
      - name: Upload responsive failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: responsive-test-evidence
          path: frontend/test-results/responsive
          if-no-files-found: ignore
      - name: type-check
        run: bunx svelte-check --threshold error
      # Dead exports. Neither gate above can see them: noUnusedLocals flags
      # locals not exports, and svelte-check skips @ts-nocheck files.
      - name: dead-export check
        run: bun run knip
      - name: build
        run: bun run build

  bun-audit:
    needs: changes
    if: >-
      needs.changes.outputs.frontend_deps == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Build and test tooling runs on contributor machines and CI; all frontend
      # packages are devDependencies, so --prod would audit an empty graph.
      - name: Audit all frontend dependencies (moderate+)
        run: bun audit --audit-level=moderate

  cargo-audit:
    needs: changes
    if: >-
      needs.changes.outputs.rust_deps == 'true' ||
      needs.changes.outputs.rust_audit == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      # Compiles cargo-audit from source whenever setup-rust's ~/.cargo/bin
      # cache misses, which was every pull request while the default branch had
      # no seeded cache: re-measured 2026-09-13 on run 34728226930 at 2m51s of a
      # 3m07s job, against the 0m10s the job takes once that cache is warm.
      # setup-rust now keeps the default branch seeded (see the develop trigger),
      # so re-measure before replacing this with a prebuilt-binary action.
      - name: Install cargo-audit (cached by setup-rust)
        run: cargo install --locked cargo-audit
      - name: cargo audit
        run: cargo audit --deny warnings

  cargo-shear:
    needs: changes
    if: >-
      needs.changes.outputs.rust_deps == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Install cargo-shear (cached by setup-rust)
        run: cargo install --locked cargo-shear
      - name: cargo shear
        run: cargo shear

  cargo-test:
    needs: changes
    if: >-
      needs.changes.outputs.rust_code == 'true' ||
      needs.changes.outputs.rust_deps == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      # Cargo.lock is part of what ships, not a local cache: anyone building
      # the tag from source runs `cargo build --frozen`, which aborts rather
      # than rewrite the lock. Every build in this repo has network access and
      # quietly re-resolves it instead, so a version bump that edits Cargo.toml
      # alone is green here and wrong in the tag - how 0.3.5 and 0.3.6 both
      # shipped unbuildable from source. Dependency and release-metadata
      # changes run this before compiling the workspace.
      - name: Gate - Cargo.lock already matches the manifests
        if: >-
          needs.changes.outputs.rust_deps == 'true' ||
          needs.changes.outputs.ci == 'true' ||
          github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: cargo fetch --locked
      # tennoworth-desktop (Tauri v2) links the Linux GUI stack; without these
      # -dev packages the *-sys crates fail at pkg-config and the whole
      # workspace test run dies before a single test executes.
      - name: Install Tauri Linux deps
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev libtesseract-dev libleptonica-dev libxcb1-dev patchelf
      - name: Stage pinned overlay OCR model
        run: |
          set -euo pipefail
          mkdir -p tennoworth-desktop/resources/tessdata
          curl --fail --location --retry 3 \
            https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/eng.traineddata \
            --output tennoworth-desktop/resources/tessdata/eng.traineddata
          echo '7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2  tennoworth-desktop/resources/tessdata/eng.traineddata' | sha256sum --check
      # Covers the retired Python parity gates: wfm-scrape's fixture integration
      # tests (rust/wfm-scrape/tests/) shell the freshly-built binary against
      # the frozen fixtures. cargo rebuilds the binary before they run, so a
      # stale artifact cannot green them.
      - name: cargo test
        run: cargo test
      - name: Real three-reward OCR regression
        # OpenMP oversubscription slows small OCR crops on shared CI CPUs.
        env:
          OMP_THREAD_LIMIT: '1'
        run: >-
          cargo test -p tennoworth-desktop
          real_three_reward_capture_survives_common_display_shapes -- --ignored --nocapture

  # The desktop version is pinned in two places (Cargo.toml and Cargo.lock's
  # own entry). Until this job existed the only thing that checked
  # them was the release workflow, so drift was discovered while shipping:
  # package.json sat at 0.3.3 under a 0.3.6 desktop for three releases, and
  # 0.3.5 and 0.3.6 both shipped a Cargo.lock naming the previous version -
  # unbuildable from source, because a --frozen build never rewrites a lock.
  #
  # Same script the release's preflight runs, minus --release: on a PR the repo
  # legitimately sits AT the newest published version between releases, so only
  # "behind" is drift. When the version advances, it also requires the complete
  # structured release-note contract before the preparation PR can merge.
  version-pins:
    needs: changes
    if: >-
      needs.changes.outputs.version == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Version pins and release notes agree
        run: bun scripts/release.ts check

  # rust/Cargo.toml denies the crash-prone Clippy family workspace-wide.
  # Test panics are allowed by clippy.toml; impossible production paths carry
  # a narrow allow with the invariant beside the code.
  cargo-clippy:
    needs: changes
    if: >-
      needs.changes.outputs.rust_code == 'true' ||
      needs.changes.outputs.rust_deps == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
      - name: Install Tauri Linux deps
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev libtesseract-dev libleptonica-dev libxcb1-dev patchelf
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

  market-data:
    needs: changes
    if: >-
      needs.changes.outputs.market_data == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Snapshot validator tests
        run: bun test scripts/release.test.ts
      - name: Validate committed data
        run: |
          bun scripts/release.ts snapshot-check
          jq -e 'type == "object"' frontend/public/definitions.json

  deploy-validation:
    needs: changes
    if: >-
      needs.changes.outputs.deploy == 'true' ||
      needs.changes.outputs.ci == 'true' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Deployment layout regression tests
        run: bun test scripts/deploy-layout.test.ts
      - name: Shell syntax
        run: |
          for script in deploy/*.sh scripts/*.sh; do
            bash -n "$script"
          done
      - name: systemd unit syntax
        run: |
          sudo install -d -m 0755 /srv/wfm/app
          sudo install -m 0755 deploy/*.sh /srv/wfm/
          sudo install -D -m 0755 /bin/true /srv/wfm/bin/tennoworth-usage
          systemd-analyze verify deploy/*.service deploy/*.timer
      - name: CSP copies agree
        run: bun scripts/sync-csp.ts --check
      - name: Install Caddy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends caddy
      - name: Caddyfile syntax
        run: caddy validate --config deploy/Caddyfile --adapter caddyfile

  # This is the required audit status. It runs even when a prerequisite is
  # skipped and fails only when a relevant job failed or was cancelled.
  audit-gate:
    if: ${{ always() }}
    needs:
      - changes
      - frontend-check
      - bun-audit
      - cargo-audit
      - cargo-shear
      - cargo-test
      - cargo-clippy
      - version-pins
      - market-data
      - deploy-validation
    runs-on: ubuntu-latest
    steps:
      - name: Require every applicable check to pass
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          echo "$NEEDS" | jq .
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
