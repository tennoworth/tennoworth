name: audit

# Runs dependency advisories across both ecosystems on every push and on a
# weekly schedule. Fails the workflow on anything moderate-or-higher so we
# notice before users do.

on:
  push:
    branches: [main, develop]
    # The 2-hourly market-refresh bot commits touch only these three data
    # files; skip a full CI run for a data-only push (~85 wasted runs/week).
    paths-ignore:
      - 'prototype/public/market.json'
      - 'prototype/public/wfstat-catalog.json'
      - 'wfm_results.csv'
  pull_request:
  schedule:
    - cron: '17 4 * * 1'  # every Monday at 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bun-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: prototype
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: bun audit (moderate+)
        run: bun audit --prod --audit-level=moderate
      - name: tests
        run: bun run test
      - name: type-check
        run: bunx svelte-check --threshold error
      # Dead exports. Neither gate above can see them: noUnusedLocals flags
      # locals not exports, and svelte-check skips @ts-nocheck files.
      - name: dead-export check
        run: bun run knip
      - name: build
        run: bun run build

  cargo-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      # Reads as an expensive from-source build and isn't: Swatinem/rust-cache
      # in setup-rust caches ~/.cargo/bin, so this resolves as already-installed.
      # Measured on run 30705176923 — 0 s for this step, 23 s for the whole job.
      # Don't "optimize" it into a prebuilt-binary action without re-measuring.
      - name: Install cargo-audit (cached by setup-rust)
        run: cargo install --locked cargo-audit
      - name: cargo audit
        run: cargo audit --deny warnings

  cargo-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust
      # Cargo.lock is part of what ships, not a local cache: anyone building
      # the tag from source runs `cargo build --frozen`, which aborts rather
      # than rewrite the lock. Every build in this repo has network access and
      # quietly re-resolves it instead, so a version bump that edits Cargo.toml
      # alone is green here and wrong in the tag — how 0.3.5 and 0.3.6 both
      # shipped unbuildable from source (the retired AUR source package was
      # where that surfaced). Run on every push, where it's cheap to fix.
      - name: Gate — Cargo.lock already matches the manifests
        run: cargo fetch --locked
      # tennoworth-desktop (Tauri v2) links the Linux GUI stack; without these
      # -dev packages the *-sys crates fail at pkg-config and the whole
      # workspace test run dies before a single test executes.
      - name: Install Tauri Linux deps
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev patchelf
      # Covers the retired Python parity gates: wfm-scrape's fixture integration
      # tests (companion/wfm-scrape/tests/) shell the freshly-built binary against
      # the frozen fixtures. cargo rebuilds the binary before they run, so a
      # stale artifact cannot green them.
      - name: cargo test
        run: cargo test

  # The desktop version is pinned in two places (Cargo.toml and Cargo.lock's
  # own entry — the two AUR PKGBUILDs went with the AUR packages when Linux
  # became AppImage-only). Until this job existed the only thing that checked
  # them was the release workflow, so drift was discovered while shipping:
  # package.json sat at 0.3.3 under a 0.3.6 desktop for three releases, and
  # 0.3.5 and 0.3.6 both shipped a Cargo.lock naming the previous version —
  # unbuildable from source, because a --frozen build never rewrites a lock.
  #
  # Same script the release's preflight runs, minus --release: on a PR the repo
  # legitimately sits AT the newest published version between releases, so only
  # "behind" is drift.
  version-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Version pins agree
        run: bun scripts/release.ts check

  # Unwrap/expect in production code is a crash (Tauri does not catch command
  # panics) plus a poisoned mutex; the allowlist in scripts/check-panic-sites.ts
  # holds the ~8 sites that are unreachable by construction. Fails on any NEW
  # site outside it - fix the site, or add it with a why-comment, never silently.
  panic-site-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: No new production unwrap()/expect() outside the allowlist
        run: bun scripts/check-panic-sites.ts
