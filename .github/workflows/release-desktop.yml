name: release-desktop

# Builds, signs and publishes the Tauri desktop app + the `latest.json`
# manifest the in-app updater reads, plus the Linux deb/rpm and the two AUR
# packages. The desktop app is the only interactive product, so this is the
# repo's single versioned release stream (the old CLI release workflow was
# removed with the CLI).
#
# Cut a release by tagging `desktop-v<semver>` on main. The tag must match
# `tauri.conf.json`'s version or the guard below fails the run: the updater
# compares the manifest version against the version compiled into the app,
# so a tag/config mismatch ships a manifest that either can't install or
# offers a phantom upgrade.
#
# The same tag also publishes packaging/aur/ to aur.archlinux.org via the
# `aur` job — that is the channel Arch users actually install from, and before
# the job existed a bump stopped at the repo: AUR sat at 0.3.1 while the repo
# shipped 0.3.4 (see the job's comment).

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Windows only. Linux is built by the `linux-binary` job below, which emits
  # the deb/rpm the self-hosted apt and dnf repos are served from, alongside
  # packaging/aur/PKGBUILD for source builds.
  #
  # No AppImage, deliberately: the one this workflow used to publish bundled
  # ubuntu-22.04's WebKitGTK and aborted at `Could not create default EGL
  # display: EGL_BAD_PARAMETER` against a rolling-release host's Mesa — a white
  # window, before the webview paints. That is inherent to shipping a
  # GPU-dependent stack built on an old distro, not something a flag fixes.
  # Tauri's Linux updater only ever supported AppImage, so Linux self-update
  # goes through the distro repos instead.
  build:
    runs-on: windows-latest
    env:
      # Generated offline by a human, never in CI, never committed — see
      # the maintainer signing runbook §9. Absent secrets make `tauri build` fail
      # loudly rather than publish a release the updater can never install
      # (bundle.createUpdaterArtifacts is on, and signing them needs the key).
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Refuse to build without the updater signing key
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error title=No updater signing key::TAURI_SIGNING_PRIVATE_KEY is not set. Generate the keypair offline (the maintainer signing runbook §9) and add it as a repo secret. Publishing unsigned bundles would produce a latest.json no installed app can ever accept."
            exit 1
          fi

      # Three versions must agree, and nothing else enforces it:
      #   - the tag          → names the release
      #   - tauri.conf.json  → the version written into latest.json
      #   - Cargo.toml       → CARGO_PKG_VERSION, what the running app reports
      #                        as "you have vX" and compares against
      # Drift is silent and only surfaces on user machines, as an update that
      # installs but never seems to take effect (manifest newer than config)
      # or one that's never offered at all (config ahead of manifest).
      - name: Check tag, tauri.conf.json and Cargo.toml versions agree
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#desktop-v}"
          conf_version=$(grep -m1 '"version"' companion/tennoworth-desktop/tauri.conf.json | cut -d'"' -f4)
          cargo_version=$(grep -m1 '^version' companion/tennoworth-desktop/Cargo.toml | cut -d'"' -f2)
          if [ "$tag_version" != "$conf_version" ] || [ "$tag_version" != "$cargo_version" ]; then
            echo "::error title=Version mismatch::tag=desktop-v$tag_version tauri.conf.json=$conf_version Cargo.toml=$cargo_version — all three must match."
            exit 1
          fi
          echo "Version $conf_version confirmed across tag, tauri.conf.json and Cargo.toml."

      - uses: oven-sh/setup-bun@v2

      - uses: ./.github/actions/setup-rust

      # A fourth place the version lives, and the one the guard above can't
      # see: Cargo.lock records tennoworth-desktop's own version too. This
      # workflow's build has network access and re-resolves the lock in place,
      # so the tag's tarball can ship a lock that names the previous version —
      # unbuildable by the AUR source package, which builds --frozen. 0.3.5 and
      # 0.3.6 both shipped that way, green here, broken for every Arch user.
      - name: Gate — Cargo.lock already matches the manifests
        working-directory: companion
        run: cargo fetch --locked

      # tauri.conf.json's beforeBuildCommand runs `bun run build:desktop`, so
      # the SPA's deps must exist before tauri-action invokes the build.
      - name: Install frontend deps
        working-directory: prototype
        run: bun install --frozen-lockfile

      # Publishes to the FIXED `desktop-latest` tag, not GitHub's floating
      # "latest release". GitHub's notion of latest is repo-wide, and the
      # versioned desktop-v* tags need to be pin-able without the rolling tag
      # moving under them. A fixed tag makes the two release streams
      # independent, and matches the existing web-latest / scrape-latest
      # convention (.github/actions/publish-rolling-release). tauri.conf.json's
      # updater endpoint must keep pointing at this exact tag.
      #
      # prerelease keeps the rolling desktop build out of the repo's "Latest
      # release" badge, which belongs to the versioned desktop-v* tag (see the
      # "Publish to the versioned release" step — that one is make_latest).
      #
      # projectPath is the dir holding tauri.conf.json — this repo has no
      # `src-tauri` layout and no npm-side @tauri-apps/cli, so the action
      # installs its own CLI rather than shelling out to `bun tauri`. Local
      # builds still use `cargo tauri`; both drive the same tauri.conf.json.
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: companion/tennoworth-desktop
          tagName: desktop-latest
          releaseName: desktop-latest (auto-built)
          releaseBody: >
            Rolling desktop build. The in-app updater reads latest.json from
            this release. Not a version release — see desktop-v* tags for the
            versioned desktop app.
          releaseDraft: false
          prerelease: true
          # Windows builds both MSI and NSIS; the updater manifest can only
          # name one. NSIS is what the desktop app's install flow assumes
          # (passive install, self-restart).
          updaterJsonPreferNsis: true

      # Windows artifacts also go to the IMMUTABLE tagged release, not just the
      # rolling one. Without this there is no way to pin, re-download or roll
      # back a specific Windows version: desktop-latest is overwritten every
      # build, so a superseded installer is simply gone. (The Linux job already
      # publishes to the tag; this brings Windows in line.)
      - name: Archive artifacts on the versioned release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Collect from the bundle tree by RELATIVE path rather than from
          # tauri-action's `artifactPaths` output. That output is in native
          # Windows form (D:\a\...\TennoWorth.msi) and Git Bash could not stat
          # it even after converting to forward slashes, so every file looked
          # missing. A relative find from the workspace avoids the drive-letter
          # translation question altogether.
          find companion/target/release/bundle -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.sig' \) \
            -exec cp -v {} dist/ \;
          ls -la dist
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error title=Nothing archived::No installers found under companion/target/release/bundle. The versioned release would ship empty, leaving this build unpinnable."
            find companion/target/release/bundle -type f 2>/dev/null | head -20 || echo "(bundle dir absent)"
            exit 1
          fi

      - name: Publish archival copies
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: dist/*
          draft: false
          prerelease: false
          # make_latest:true on BOTH versioned-tag publishes: they target the
          # same desktop-v* release from two parallel jobs (this one on the
          # Windows build, the Linux one below), and whichever runs last wins
          # the release's state. Both must assert Latest, or the last writer
          # with make_latest:false would demote the badge.
          make_latest: true

      # Stale-asset cleanup runs AFTER the upload, never before.
      #
      # It used to run first, which meant desktop-latest sat empty for the whole
      # ~8-minute build and latest.json 404'd for every client that checked in
      # that window — trading the stale-asset bug for a worse one. Cleaning up
      # afterwards means the previous release stays intact and servable right up
      # until the new one replaces it, and clients only ever see a complete
      # manifest: the old version during the build, the new one after.
      - name: Remove superseded assets from the rolling release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#desktop-v}"
          gh release view desktop-latest --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | while read -r asset; do
              [ -z "$asset" ] && continue
              case "$asset" in
                latest.json)  echo "keep (manifest): $asset" ;;
                *"$ver"*)     echo "keep (current):  $asset" ;;
                *)            echo "remove (stale):  $asset"
                              gh release delete-asset desktop-latest "$asset" \
                                --repo "$GITHUB_REPOSITORY" --yes ;;
              esac
            done

  # Raw Linux binary for the AUR `tennoworth-bin` package. Deliberately NOT an
  # AppImage: bundling a GPU-dependent stack is exactly what made 0.3.0 paint a
  # white window. This ships one dynamically-linked executable that resolves
  # webkit2gtk/gtk3 from the user's own system at runtime, same as the
  # source-built package — it only skips the compile.
  #
  # ubuntu-22.04 is load-bearing, not incidental: glibc is backward- but not
  # forward-compatible, so the build host's glibc becomes the floor for every
  # user. 22.04's 2.35 runs everywhere current; a binary built on a rolling
  # distro would demand a glibc most users don't have yet. Same reasoning as
  # build-scrape.yml's Linux leg.
  #
  # Publishes to the VERSIONED tag, never to rolling desktop-latest: a PKGBUILD
  # pins a sha256, so its source URL has to be immutable. An asset that gets
  # overwritten by the next release would break every installed package's
  # checksum the moment a new version ships.
  linux-binary:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: ./.github/actions/setup-rust

      # Identical list to audit.yml's — without these the *-sys crates fail at
      # pkg-config before anything builds.
      - name: Install Tauri Linux deps
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev

      # tauri-build embeds the SPA at compile time from frontendDist, and plain
      # `cargo build` does not run tauri.conf.json's beforeBuildCommand the way
      # `cargo tauri build` does — so the frontend is built explicitly here.
      # packaging/aur/PKGBUILD does the same thing for the same reason.
      - name: Build frontend
        working-directory: prototype
        run: |
          bun install --frozen-lockfile
          bun run build:desktop

      # `tauri build` rather than `cargo build`: it produces the same binary at
      # target/release/tennoworth-desktop (so the glibc check and the tarball
      # below are unchanged) AND emits the deb/rpm the apt/dnf repos are built
      # from. No tagName here, so the action builds without publishing —
      # artifacts are staged and released explicitly further down.
      #
      # These bundles do NOT bundle WebKitGTK; they declare a dependency on the
      # system one, which is why they are safe where the old AppImage was not
      # (that bundled ubuntu-22.04's WebKit and died at EGL init on rolling
      # Mesa — see the comment at the top of this file).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # bundle.createUpdaterArtifacts is on globally; without the key the
          # bundler logs a signing error even though Linux ships no updater
          # format. Passing it keeps the log clean and the failure meaningful.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: companion/tennoworth-desktop
          args: --bundles deb,rpm

      # Fails the release rather than shipping a binary that won't start on a
      # user's machine. 2.35 is what ubuntu-22.04 provides; anything higher
      # means the toolchain pulled in a newer symbol and the portability
      # guarantee above is silently gone.
      - name: Verify glibc floor
        run: |
          set -euo pipefail
          bin=companion/target/release/tennoworth-desktop
          max=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "highest glibc symbol required: $max"
          if [ "$(printf '%s\n2.35\n' "$max" | sort -V | tail -1)" != "2.35" ]; then
            echo "::error title=glibc floor too high::Binary needs glibc $max but the build host should cap it at 2.35. It would fail to start on older distros."
            exit 1
          fi
          ldd "$bin" | grep -E 'webkit2gtk|libgtk-3' || true

      # One self-contained tarball: binary + desktop entry + icons. The -bin
      # PKGBUILD needs all three (without the .desktop and icons the app gets a
      # generic WM avatar in the taskbar), and shipping them together beats
      # either duplicating them into the AUR repo or making the package pull
      # the whole source tarball just to extract a few PNGs.
      - name: Stage artifact
        run: |
          set -euo pipefail
          stage="tennoworth-desktop-linux-x86_64"
          mkdir -p "dist/$stage/icons"
          cp companion/target/release/tennoworth-desktop "dist/$stage/"
          cp packaging/aur/tennoworth/tennoworth.desktop "dist/$stage/"
          for f in 32x32.png 64x64.png 128x128.png 128x128@2x.png icon.png; do
            cp "companion/tennoworth-desktop/icons/$f" "dist/$stage/icons/"
          done
          cp LICENSE "dist/$stage/"
          tar -C dist -czf "dist/$stage.tar.gz" "$stage"
          rm -rf "dist/$stage"
          cd dist && sha256sum "$stage.tar.gz" | tee "$stage.tar.gz.sha256"

      # The deb/rpm the self-hosted apt and dnf repos are built from. Names are
      # normalised to fixed filenames because deploy/pull-packages.sh on the box
      # fetches them by name from the release — Tauri's own names embed the
      # version (TennoWorth_0.3.3_amd64.deb), which would make the puller need
      # to know the version before it can fetch it.
      #
      # Package name inside the deb/rpm is `tenno-worth` (Tauri kebab-cases
      # productName and offers no override); both declare `Provides: tennoworth`
      # so `apt install tennoworth` still resolves. Don't "fix" the filenames to
      # match the provide — the puller matches on these.
      - name: Stage Linux packages
        run: |
          set -euo pipefail
          deb=$(find companion/target/release/bundle/deb -name '*.deb' | head -1)
          rpm=$(find companion/target/release/bundle/rpm -name '*.rpm' | head -1)
          [ -n "$deb" ] && [ -n "$rpm" ] || {
            echo "::error title=Missing Linux bundle::tauri build did not emit a deb and an rpm"
            exit 1
          }
          cp "$deb" dist/tennoworth-desktop-amd64.deb
          cp "$rpm" dist/tennoworth-desktop-x86_64.rpm
          cd dist
          sha256sum tennoworth-desktop-amd64.deb   | tee tennoworth-desktop-amd64.deb.sha256
          sha256sum tennoworth-desktop-x86_64.rpm  | tee tennoworth-desktop-x86_64.rpm.sha256

      # The versioned desktop-v* release is the repo's "Latest release" badge —
      # the desktop app is the product (the standalone CLI companion no longer
      # exists, so there is no competing v* release stream).
      - name: Publish to the versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            dist/tennoworth-desktop-linux-x86_64.tar.gz
            dist/tennoworth-desktop-linux-x86_64.tar.gz.sha256
            dist/tennoworth-desktop-amd64.deb
            dist/tennoworth-desktop-amd64.deb.sha256
            dist/tennoworth-desktop-x86_64.rpm
            dist/tennoworth-desktop-x86_64.rpm.sha256
          draft: false
          prerelease: false
          make_latest: true
          body: |
            Linux binary for the AUR `tennoworth-bin` package, dynamically
            linked against system webkit2gtk/gtk3 (glibc floor 2.35).

            `.deb` and `.rpm` are pulled by the box and republished into the
            signed apt/dnf repos at https://tennoworth.app/apt and /rpm — they
            are here so the repo builder has an immutable, versioned source.

            Windows installers and the updater manifest live on the rolling
            [desktop-latest](https://github.com/tennoworth/tennoworth/releases/tag/desktop-latest)
            release. Linux source builds: `packaging/aur/`.

  # AUR publish — the delivery channel Arch users actually install from. The
  # release jobs build things; this job ships the recipes. It exists because a
  # `desktop-v*` bump used to stop at the repo: the PKGBUILDs said 0.3.4 while
  # aur.archlinux.org sat at 0.3.1 for three releases, because "push to the
  # AUR" was a manual step nobody remembered.
  #
  # `needs: linux-binary` is load-bearing, not just order: the tennoworth-bin
  # checksum is computed from the tarball that job uploads, so publishing first
  # would pin a URL that does not exist yet.
  aur:
    needs: linux-binary
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    env:
      # Absent ('') → the keyed steps no-op and the release still ships, with
      # a notice. The AUR key is account-specific (aur.archlinux.org
      # authenticates per maintainer account), so a repo or fork without the
      # maintainer's key must not fail a desktop build.
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip AUR publish — no key configured
        if: env.AUR_SSH_PRIVATE_KEY == ''
        run: |
          echo "::notice title=AUR publish skipped::AUR_SSH_PRIVATE_KEY is not configured — aur.archlinux.org packages were NOT updated for this release. See packaging/aur/README.md."

      - name: Gate — both PKGBUILDs must carry the tag's version
        if: env.AUR_SSH_PRIVATE_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#desktop-v}"
          for pkg in tennoworth tennoworth-bin; do
            pkgver=$(grep -m1 '^pkgver=' "packaging/aur/$pkg/PKGBUILD" | cut -d= -f2)
            if [ "$tag_version" != "$pkgver" ]; then
              echo "::error title=AUR pkgver mismatch::packaging/aur/$pkg/PKGBUILD says pkgver=$pkgver but the tag is desktop-v$tag_version. Bump pkgver in both PKGBUILDs in the same commit as the desktop version bump, BEFORE tagging."
              exit 1
            fi
          done
          echo "pkgver=$tag_version confirmed across both PKGBUILDs."

      - name: Install AUR SSH key, pinning the host key
        if: env.AUR_SSH_PRIVATE_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          install -m700 -d "$HOME/.ssh"
          # Pinned ed25519, not accept-new: aur.archlinux.org publishes its
          # fingerprints, and a MITM between the runner and the AUR would
          # otherwise quietly install a different host key.
          printf '%s\n' 'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' > "$HOME/.ssh/known_hosts"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          # Fail with a readable message instead of ssh's cryptic
          # "error in libcrypto" if the key is malformed (e.g. the secret
          # lost its trailing newline). ssh-keygen -lf parses the key; a bad
          # one never reaches the AUR.
          ssh-keygen -lf "$HOME/.ssh/aur" >/dev/null
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes" >> "$GITHUB_ENV"

      - name: Publish both packages to the AUR
        if: env.AUR_SSH_PRIVATE_KEY != ''
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#desktop-v}"
          repo="$GITHUB_REPOSITORY"

          # Checksums are computed at publish time from the exact artifacts the
          # tag carries, so they cannot go stale between a bump and a push. The
          # bin tarball's hash is cross-checked against the .sha256 the
          # linux-binary job uploaded — a release that disagrees with its own
          # attestation is failed loudly, not pinned.
          bin_sha=$(curl -fsSL "https://github.com/$repo/releases/download/desktop-v$ver/tennoworth-desktop-linux-x86_64.tar.gz" | sha256sum | cut -d' ' -f1)
          src_sha=$(curl -fsSL "https://github.com/$repo/archive/refs/tags/desktop-v$ver.tar.gz" | sha256sum | cut -d' ' -f1)
          published_bin_sha=$(curl -fsSL "https://github.com/$repo/releases/download/desktop-v$ver/tennoworth-desktop-linux-x86_64.tar.gz.sha256" | awk '{print $1}')
          if [ "$bin_sha" != "$published_bin_sha" ]; then
            echo "::error title=Checksum mismatch::bin tarball hashes $bin_sha (computed) and $published_bin_sha (release .sha256) disagree. Refusing to pin."
            exit 1
          fi
          echo "bin=$bin_sha src=$src_sha (bin cross-checked against the release's own .sha256)"

          mkdir -p "$RUNNER_TEMP/aur"
          for spec in "tennoworth:$src_sha" "tennoworth-bin:$bin_sha"; do
            pkg="${spec%%:*}"
            sha="${spec##*:}"
            git clone "ssh://aur@aur.archlinux.org/$pkg.git" "$RUNNER_TEMP/aur/$pkg"
            # Sync the AUR tree to the repo's, not just copy over it: a file
            # removed from the recipe must disappear from the AUR too. The
            # -not -path excludes both `.git` itself and everything under it.
            find "$RUNNER_TEMP/aur/$pkg" -mindepth 1 -not -path '*/.git' -not -path '*/.git/*' -delete
            cp -r "packaging/aur/$pkg/." "$RUNNER_TEMP/aur/$pkg/"
            # The repo's PKGBUILD carries 'SKIP' as a parse placeholder (see
            # packaging/aur/README.md); the AUR copy gets the real checksum.
            sed -i "s/sha256sums=('SKIP')/sha256sums=('$sha')/" "$RUNNER_TEMP/aur/$pkg/PKGBUILD"
            # .SRCINFO is generated in a throwaway Arch container, never
            # written by hand: makepkg is Arch-only, and the AUR rejects a push
            # whose .SRCINFO disagrees with its PKGBUILD.
            #
            # makepkg refuses to run as root, so it drops to a throwaway
            # `builder` whose uid MUST match the owner of the bind mount. A bare
            # `useradd` lands on uid 1000 while the runner's checkout is owned by
            # 1001, and makepkg's first act is to check $BUILDDIR — which
            # defaults to the PKGBUILD dir — for write permission, aborting with
            # `You do not have write permission for the directory $BUILDDIR
            # (/pkg)`. That failed on every release ever cut; it stayed invisible
            # because the clone above never got past `Permission denied
            # (publickey)` until the AUR key was replaced, so the job had never
            # once reached this line. Reproduced locally against a mount chowned
            # to 1001, and verified fixed the same way.
            #
            # Deriving the uid (rather than chowning /pkg to builder) keeps the
            # host ownership intact — chowning would hand the directory to a uid
            # the runner does not own, and the `git add`/`commit` below would
            # then trip git's dubious-ownership guard.
            #
            # The `> .SRCINFO` redirect still runs as root INSIDE the container,
            # landing a world-readable file the runner can read.
            docker run --rm -v "$RUNNER_TEMP/aur/$pkg:/pkg" -w /pkg archlinux:latest \
              sh -c 'uid=$(stat -c %u /pkg); useradd -m -u "$uid" builder; su builder -c "cd /pkg && makepkg --printsrcinfo" > .SRCINFO'
            grep -q "sha256sums = $sha" "$RUNNER_TEMP/aur/$pkg/.SRCINFO" || {
              echo "::error title=.SRCINFO mismatch::$pkg's generated .SRCINFO does not carry checksum $sha. Aborting before push."
              exit 1
            }
            (
              cd "$RUNNER_TEMP/aur/$pkg"
              git add -A
              git -c user.name="$GITHUB_ACTOR" -c user.email="$GITHUB_ACTOR@users.noreply.github.com" \
                commit -m "$pkg $ver"
              git push origin HEAD
            )
            echo "::notice title=AUR published::$pkg $ver pushed to aur.archlinux.org"
          done
