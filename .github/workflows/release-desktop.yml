name: release-desktop

# Builds, signs and publishes the Tauri desktop app + the `latest.json`
# manifest the in-app updater reads. Two platforms, two artifacts: the Windows
# installers and ONE Linux AppImage. The desktop app is the only interactive
# product, so this is the repo's single versioned release stream (the old CLI
# release workflow was removed with the CLI).
#
# ---------------------------------------------------------------------------
# HOW TO CUT A RELEASE
#
#   Actions → release-desktop → Run workflow, from `main`, version = X.Y.Z
#
# There is deliberately NO tag trigger. The tag is no longer the *input* to a
# release — it is an *output*, created by this workflow at the exact `main`
# commit it captured and built. That closes three holes at once: a tag can no
# longer point at a non-main commit, a half-finished release can no longer
# leave a tag behind, and "re-run the release" is a well-defined operation
# rather than a delete-and-retag dance.
#
# THE RELEASE BECOMES PUBLIC EXACTLY ONCE. Builds publish nothing; they hand
# every artifact to the `publish` job, which verifies the full inventory, uploads
# into a DRAFT release, and flips one `--draft=false`. Before that flip there is
# no tag and no visible release; after it, everything is there. The old flow
# published from two racing jobs at `draft: false`, so a release went public with
# a partial asset set and a trailing publish job could still fail afterwards
# (0.3.5, run 30806615370).
#
# Bundle layout, in publish order:
#
#   preflight        validate the version against every pin, the tag, the
#                    published history and Cargo.lock. Capture the main SHA.
#   build-windows    ─┐ parallel, contents: read, publish nothing
#   build-linux      ─┘ every output uploaded as a workflow artifact
#   publish          verify inventory + signatures, tag, draft, upload, flip
#   desktop-latest   refresh the legacy rolling updater endpoint
#
# LINUX IS APPIMAGE ONLY. That is the state, not a direction of travel: the
# deb/rpm bundles, the self-hosted apt/dnf repositories and the two AUR
# packages were all retired, and the jobs and steps that produced them are
# gone from this file. The AppImage is the only Linux channel that self-updates
# (the Tauri updater enables itself when $APPIMAGE is set — see update.rs), so
# it was the only one worth keeping, and four delivery channels for one
# platform was three too many to keep correct. See build-linux's libwayland
# step for why the first AppImage was withdrawn in 2026-07 and what fixed it.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, X.Y.Z (no leading v, no prerelease suffix)'
        required: true
        type: string

# Read by default. Only `publish` and `desktop-latest` get write, and only
# because they create the tag and the release assets. A build job that can
# write to the repo is a build job that can publish half a release.
permissions:
  contents: read

# Two releases must never interleave: they would fight over the same
# `desktop-latest` assets. cancel-in-progress is false on purpose — cancelling
# a run that has already flipped the draft would leave the rolling updater
# endpoint behind the published release.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  # Everything that can be known before a single byte is compiled. A release
  # that is going to fail on a version mismatch should fail in 30 seconds, not
  # after two ~8-minute builds.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
      tag: ${{ steps.check.outputs.tag }}
      notes: ${{ steps.notes.outputs.body }}
    steps:
      # The ref is not just a convention here: `publish` creates the tag at the
      # SHA this job captured, so allowing a dispatch from a feature branch
      # would mean tagging a release at a commit that was never on main.
      - name: Guard — releases are cut from main only
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error title=Wrong ref::release-desktop was dispatched from $REF. A release is cut from refs/heads/main only — the tag is created at the commit this run captures."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: ./.github/actions/setup-rust

      # The SAME check that runs on every PR (audit.yml), given the version
      # this run was asked for. On a PR it asserts the pins agree with each
      # other and are not behind what is published; `--release` additionally
      # asserts they equal the requested version and are strictly ahead of it,
      # because the updater only ever offers a greater version.
      #
      # Sharing one implementation is the point: a release-time-only guard is
      # a guard that first tells you about drift when you are trying to ship.
      - name: Version pins agree with the requested release
        env:
          VERSION: ${{ inputs.version }}
        run: bun scripts/release.ts check --release "$VERSION"

      # The CHANGELOG section for this version IS the release body. `prepare`
      # opened it; a missing or empty section fails here, before any build,
      # rather than shipping boilerplate notes.
      - name: Release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          {
            echo "body<<NOTES_EOF"
            bun scripts/release.ts notes "$VERSION"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Validate the tag and the release history
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Via env, never interpolated into the script body: a
          # workflow_dispatch input is attacker-influenced text as far as the
          # shell is concerned.
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Re-asserted here because everything below builds a ref name out of
          # it. release.ts has already rejected anything that is not strict
          # X.Y.Z; this is the guard that keeps THIS script's string handling
          # honest.
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'; then
            echo "::error title=Not a version::'$VERSION' is not a strict X.Y.Z semver."
            exit 1
          fi
          tag="desktop-v$VERSION"

          # The tag must not exist. If it does, either the release already
          # happened or a previous run died between tagging and publishing —
          # both need a human, not a silent overwrite.
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "::error title=Tag exists::$tag already exists. If a previous run died after tagging, use 'Re-run failed jobs' on THAT run (publish is idempotent); otherwise this version is taken — pick the next one. The tag cannot be deleted: the 'Desktop release tags' ruleset has no bypass actors."
            exit 1
          fi

          # Monotonicity is the previous step's job (release.ts --release
          # compares against every published desktop-v* tag, sorted by version
          # rather than by creation date). Duplicating it here would be a
          # second implementation to keep in step.

          sha=$(git rev-parse HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"        >> "$GITHUB_OUTPUT"
          echo "sha=$sha"        >> "$GITHUB_OUTPUT"
          echo "Releasing $tag from $sha"

      # Cargo.lock is part of what ships, not a local cache. Every build in
      # this repo has network access and quietly re-resolves a stale lock, so a
      # version bump that edits Cargo.toml alone is green everywhere and wrong
      # in the tag — how 0.3.5 and 0.3.6 both shipped a lock naming the
      # PREVIOUS version, unbuildable from source with `cargo build --frozen`
      # (which is what any from-source packager does; it was the retired AUR
      # source package that found it). `--locked` reproduces that refusal here,
      # before anything is built, and keeps the lock an honest version pin.
      - name: Gate — Cargo.lock already matches the manifests
        working-directory: companion
        run: cargo fetch --locked

  # Windows. Publishes NOTHING — every output leaves as a workflow artifact.
  build-windows:
    needs: preflight
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # Generated offline by a human, never in CI, never committed — see
      # the maintainer signing runbook §9. Absent secrets make `tauri build` fail
      # loudly rather than publish a release the updater can never install
      # (bundle.createUpdaterArtifacts is on, and signing them needs the key).
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      # Pinned to the SHA preflight captured, not to whatever main points at
      # now: a push landing mid-release must not end up inside the build.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Refuse to build without the updater signing key
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error title=No updater signing key::TAURI_SIGNING_PRIVATE_KEY is not set. Generate the keypair offline (the maintainer signing runbook §9) and add it as a repo secret. Publishing unsigned bundles would produce a latest.json no installed app can ever accept."
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: ./.github/actions/setup-rust

      # tauri.conf.json's beforeBuildCommand runs `bun run build:desktop`, so
      # the SPA's deps must exist before tauri-action invokes the build.
      - name: Install frontend deps
        working-directory: prototype
        run: bun install --frozen-lockfile

      # No tagName, no release inputs: the action builds and stops. Publishing
      # is the `publish` job's single responsibility.
      #
      # projectPath is the dir holding tauri.conf.json — this repo has no
      # `src-tauri` layout and no npm-side @tauri-apps/cli, so the action
      # installs its own CLI rather than shelling out to `bun tauri`. Local
      # builds still use `cargo tauri`; both drive the same tauri.conf.json.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        id: tauri
        env:
          # The action reads this even on the build-only path. Under this job's
          # `contents: read` it cannot create or modify a release, so it is
          # scoped to what the action actually needs here.
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: companion/tennoworth-desktop
          args: --bundles nsis,msi

      - name: Stage Windows artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # Collect from the bundle tree by RELATIVE path rather than from
          # tauri-action's `artifactPaths` output. That output is in native
          # Windows form (D:\a\...\TennoWorth.msi) and Git Bash could not stat
          # it even after converting to forward slashes, so every file looked
          # missing. A relative find from the workspace avoids the drive-letter
          # translation question altogether.
          find companion/target/release/bundle -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.sig' \) \
            -exec cp -v {} dist/ \;
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error title=Nothing built::No installers found under companion/target/release/bundle."
            find companion/target/release/bundle -type f 2>/dev/null | head -20 || echo "(bundle dir absent)"
            exit 1
          fi

          # SHA-256 sidecars. SECURITY.md's "How to verify a release" tells
          # Windows users to check these; before 0.4.0 they did not exist and
          # the installers shipped with only a .sig, which is a minisign
          # signature for the updater and not something a user can verify by
          # hand. sha256sum (not certutil) so the format matches the Linux
          # sidecars and one instruction covers every platform.
          (
            cd dist
            for f in *.exe *.msi; do
              [ -e "$f" ] || continue
              sha256sum "$f" | tee "$f.sha256"
            done
          )
          ls -la dist

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-bundles
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Linux. Publishes NOTHING — every output leaves as a workflow artifact.
  #
  # ubuntu-22.04 is load-bearing, not incidental: glibc is backward- but not
  # forward-compatible, so the build host's glibc becomes the floor for every
  # user. 22.04's 2.35 runs everywhere current; a binary built on a rolling
  # distro would demand a glibc most users don't have yet. Same reasoning as
  # build-scrape.yml's Linux leg.
  build-linux:
    needs: preflight
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Refuse to build without the updater signing key
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error title=No updater signing key::TAURI_SIGNING_PRIVATE_KEY is not set. Generate the keypair offline (the maintainer signing runbook §9) and add it as a repo secret. Publishing unsigned bundles would produce a latest.json no installed app can ever accept."
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: ./.github/actions/setup-rust

      # Identical list to audit.yml's — without these the *-sys crates fail at
      # pkg-config before anything builds.
      - name: Install Tauri Linux deps
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
          librsvg2-dev

      # tauri-build embeds the SPA at compile time from frontendDist, and plain
      # `cargo build` does not run tauri.conf.json's beforeBuildCommand the way
      # `cargo tauri build` does — so the frontend is built explicitly here.
      - name: Build frontend
        working-directory: prototype
        run: |
          bun install --frozen-lockfile
          bun run build:desktop

      # `tauri build` rather than `cargo build`: it produces the same binary at
      # target/release/tennoworth-desktop (so the glibc check below is
      # unchanged) AND emits the AppImage, which is the whole Linux release.
      #
      # ONE bundle, deliberately. `deb,rpm` used to be here to feed the
      # self-hosted apt/dnf repositories; those are retired, so building them
      # would produce artifacts nothing consumes. The AppImage bundles its own
      # WebKitGTK runtime, which is why it needs the libwayland surgery below —
      # the deb/rpm used the system one and never did.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: companion/tennoworth-desktop
          args: --bundles appimage

      # Fails the release rather than shipping a binary that won't start on a
      # user's machine. 2.35 is what ubuntu-22.04 provides; anything higher
      # means the toolchain pulled in a newer symbol and the portability
      # guarantee above is silently gone.
      - name: Verify glibc floor
        run: |
          set -euo pipefail
          bin=companion/target/release/tennoworth-desktop
          max=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "highest glibc symbol required: $max"
          if [ "$(printf '%s\n2.35\n' "$max" | sort -V | tail -1)" != "2.35" ]; then
            echo "::error title=glibc floor too high::Binary needs glibc $max but the build host should cap it at 2.35. It would fail to start on older distros."
            exit 1
          fi
          ldd "$bin" | grep -E 'webkit2gtk|libgtk-3' || true

      # THE LOAD-BEARING STEP IS THE libwayland STRIP. The first AppImage
      # (2026-07) was withdrawn for "Could not create default EGL display:
      # EGL_BAD_PARAMETER" on rolling Mesa. Root-caused 2026-08-20 by A/B on
      # a Mesa 26.2 host: linuxdeploy bundles ubuntu-22.04's libwayland-
      # client/cursor/egl/server, and host Mesa's Wayland-EGL platform
      # rejects that 2022 client — remove the four libs and the identical
      # bundle runs cleanly (WebKit itself was never the problem; a
      # WEBKIT_DISABLE_DMABUF_RENDERER shim measurably did not help).
      # libwayland has a stable ABI and every desktop Linux ships it, so
      # using the host's is strictly more correct.
      #
      # Repacking invalidates the build-time updater signature, so the file
      # is re-signed afterwards — the .sig MUST be generated from the
      # repacked bytes or self-update rejects every download.
      #
      # This step also creates dist/. It used to inherit the directory from the
      # deb/rpm/tarball staging steps that ran before it; they are gone, so it
      # makes its own.
      - name: Strip bundled libwayland and repack the AppImage
        run: |
          set -euo pipefail
          mkdir -p dist
          img=$(find companion/target/release/bundle/appimage -name '*.AppImage' | head -1)
          [ -n "$img" ] || { echo "::error title=Missing AppImage::tauri build did not emit an AppImage"; exit 1; }
          chmod +x "$img"
          "$img" --appimage-extract >/dev/null
          removed=0
          for f in libwayland-client.so.0 libwayland-cursor.so.0 libwayland-egl.so.1 libwayland-server.so.0; do
            [ -f "squashfs-root/usr/lib/$f" ] && { rm "squashfs-root/usr/lib/$f"; removed=$((removed+1)); }
          done
          echo "stripped $removed bundled libwayland libs"
          [ "$removed" -gt 0 ] || echo "::warning::no bundled libwayland found — linuxdeploy behavior changed, verify on a rolling host"
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH=x86_64 ./appimagetool -n squashfs-root dist/TennoWorth-x86_64.AppImage
          bun x @tauri-apps/cli signer sign dist/TennoWorth-x86_64.AppImage
          cd dist
          sha256sum TennoWorth-x86_64.AppImage | tee TennoWorth-x86_64.AppImage.sha256
          test -f TennoWorth-x86_64.AppImage.sig

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-bundles
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The atomic moment. Nothing before this job has written anything visible;
  # nothing after it can make the release less complete than it already is.
  #
  # `environment: desktop-release` is the hook for a human approval gate —
  # configure required reviewers on it in repo settings if a release should
  # never go out unattended. It gates the flip, not the builds: the updater
  # signing secrets are consumed by the build jobs above, which declare no
  # environment, so they must stay repository secrets (moving them into this
  # environment would fail both builds at their signing-key guard).
  publish:
    needs: [preflight, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: desktop-release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.preflight.outputs.version }}
      TAG: ${{ needs.preflight.outputs.tag }}
      SHA: ${{ needs.preflight.outputs.sha }}
      NOTES: ${{ needs.preflight.outputs.notes }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      # Refuses to publish an incomplete release instead of publishing one and
      # patching it. Every name here is depended on by something: the updater
      # needs each .sig, SECURITY.md tells users to check each .sha256, and the
      # AppImage's filename is unversioned because desktop-latest serves it
      # under that exact name.
      - name: Verify the inventory is complete
        run: |
          set -euo pipefail
          cd dist
          missing=0
          for f in \
            "TennoWorth_${VERSION}_x64-setup.exe" \
            "TennoWorth_${VERSION}_x64-setup.exe.sig" \
            "TennoWorth_${VERSION}_x64-setup.exe.sha256" \
            "TennoWorth_${VERSION}_x64_en-US.msi" \
            "TennoWorth_${VERSION}_x64_en-US.msi.sig" \
            "TennoWorth_${VERSION}_x64_en-US.msi.sha256" \
            TennoWorth-x86_64.AppImage \
            TennoWorth-x86_64.AppImage.sha256 \
            TennoWorth-x86_64.AppImage.sig ; do
            if [ ! -s "$f" ]; then
              echo "::error title=Missing artifact::$f is absent or empty. Refusing to publish a partial release."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { ls -la; exit 1; }

          # Every updater-facing artifact must carry a NON-EMPTY signature. An
          # empty .sig publishes a manifest no installed app can ever accept,
          # and the failure surfaces on user machines, not here.
          for f in *.sig; do
            [ -s "$f" ] || { echo "::error title=Empty signature::$f is empty."; exit 1; }
          done

          # The sidecars are what SECURITY.md tells users to trust. Verify them
          # against the bytes about to be uploaded rather than assuming the
          # build wrote them correctly.
          for f in *.sha256; do
            sha256sum -c "$f"
          done
          ls -la

      # One file listing every asset, next to the per-file sidecars. The
      # sidecars stay: SECURITY.md's instructions use them, and `sha256sum -c`
      # against a one-line sidecar is a shorter thing to ask of a user than
      # against a file naming assets they did not download.
      - name: Assemble SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f ! -name '*.sha256' ! -name 'SHA256SUMS' -printf '%f\n' \
            | sort | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS

      # The manifest the in-app updater reads. Platform keys are exactly the
      # set the old tauri-action + patch-script pair produced:
      #
      #   windows-x86_64        NSIS setup .exe (updaterJsonPreferNsis behavior:
      #   windows-x86_64-nsis   the generic key aliases NSIS, because that is
      #                         what the app's install flow assumes — passive
      #                         install, self-restart)
      #   windows-x86_64-msi    the MSI, for anyone pinned to it
      #   linux-x86_64          the repacked, re-signed AppImage
      #
      # URLs point at the ROLLING desktop-latest tag, not at this release: the
      # endpoint baked into every shipped binary is
      # releases/download/desktop-latest/latest.json, and an updater that
      # fetched from there but downloaded from a versioned tag would be reading
      # two different sources. The desktop-latest job below puts these exact
      # files there. For the same reason latest.json is NOT attached to the
      # versioned release — its URLs would go stale the next time
      # desktop-latest is refreshed, which is the opposite of what an immutable
      # release should carry.
      - name: Assemble latest.json
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, datetime
          v    = os.environ['VERSION']
          repo = os.environ['GH_REPO']
          base = f'https://github.com/{repo}/releases/download/desktop-latest'

          def sig(name):
              with open(f'dist/{name}.sig') as fh:
                  return fh.read().strip()

          nsis = f'TennoWorth_{v}_x64-setup.exe'
          msi  = f'TennoWorth_{v}_x64_en-US.msi'
          app  = 'TennoWorth-x86_64.AppImage'

          win_nsis = {'signature': sig(nsis), 'url': f'{base}/{nsis}'}
          manifest = {
              'version': v,
              # What the update banner shows the user. The old manifest carried
              # the rolling release's boilerplate ("Not a version release…"),
              # which read as nonsense inside the app.
              'notes': f'TennoWorth desktop {v} — '
                       f'https://github.com/{repo}/releases/tag/desktop-v{v}',
              'pub_date': datetime.datetime.now(datetime.timezone.utc)
                              .isoformat(timespec='milliseconds')
                              .replace('+00:00', 'Z'),
              'platforms': {
                  'windows-x86_64':      win_nsis,
                  'windows-x86_64-nsis': win_nsis,
                  'windows-x86_64-msi':  {'signature': sig(msi), 'url': f'{base}/{msi}'},
                  'linux-x86_64':        {'signature': sig(app), 'url': f'{base}/{app}'},
              },
          }
          os.makedirs('manifest', exist_ok=True)
          with open('manifest/latest.json', 'w') as fh:
              json.dump(manifest, fh, indent=2)
          print('platforms:', sorted(manifest['platforms']))
          PY
          cat manifest/latest.json

      # Annotated, and created here rather than pushed by a human: the tag is
      # an output of a verified build, at the SHA preflight captured. The
      # "Desktop release tags" ruleset makes it undeletable and immovable once
      # it exists (docs/github-rulesets/desktop-release-tags.json).
      #
      # Idempotent, because "Re-run failed jobs" restarts this job from its
      # first step: a tag that already exists is fine if it is OURS (it
      # dereferences to this run's SHA) and a hard stop otherwise. The ruleset
      # has no bypass actors, so a wedged tag could not be deleted anyway.
      - name: Create the annotated tag
        run: |
          set -euo pipefail
          if ref_sha=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null); then
            # Annotated tag: the ref points at a tag object; resolve it to the commit.
            target=$(gh api "repos/$GH_REPO/git/tags/$ref_sha" --jq .object.sha 2>/dev/null || echo "$ref_sha")
            if [ "$target" = "$SHA" ]; then
              echo "$TAG already exists at $SHA — re-run, keeping it."
              exit 0
            fi
            echo "::error title=Tag mismatch::$TAG exists at $target, not at $SHA. That is a different release; refusing to continue."
            exit 1
          fi
          tag_object=$(gh api "repos/$GH_REPO/git/tags" -X POST \
            -f tag="$TAG" \
            -f message="TennoWorth desktop $VERSION" \
            -f object="$SHA" \
            -f type=commit \
            --jq .sha)
          gh api "repos/$GH_REPO/git/refs" -X POST \
            -f ref="refs/tags/$TAG" \
            -f sha="$tag_object" >/dev/null
          echo "created $TAG at $SHA"

      # Draft first, assets second, public third. Between these two steps the
      # release exists but is invisible to everyone except repo writers, which
      # is exactly the window the old two-job flow published into.
      #
      # Body = the CHANGELOG section preflight extracted, then a fixed footer
      # telling users how to verify what they download. Idempotent like the
      # tag step: an existing draft (from a re-run) is reused, and --clobber
      # makes the upload safe to repeat.
      - name: Create the draft release and upload every asset
        run: |
          set -euo pipefail
          notes_file=$(mktemp)
          printf '%s\n\n---\n\n' "$NOTES" > "$notes_file"
          cat >> "$notes_file" <<'EOF'
          **Windows** — download `TennoWorth_<version>_x64-setup.exe` (or the `.msi`) and
          verify it against the matching `.sha256`. The in-app updater handles
          later versions on its own.

          **Linux** — one artifact: `TennoWorth-x86_64.AppImage`. Download it,
          verify it against `TennoWorth-x86_64.AppImage.sha256`, `chmod +x`,
          run. It self-updates in place and resolves libwayland from the host.
          The apt/dnf repositories and the AUR packages are retired and frozen
          at their last published version — see `SECURITY.md`.

          `SHA256SUMS` lists every downloadable asset; per-file `.sha256`
          sidecars sit next to each one. `.sig` files are minisign signatures
          for the in-app updater, not user-facing checksums — see `SECURITY.md`.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — re-run, reusing it."
          else
            gh release create "$TAG" \
              --draft \
              --title "$TAG" \
              --target "$SHA" \
              --notes-file "$notes_file"
          fi
          # Never the updater manifest: its URLs point at the rolling tag (see
          # the assembly step). On a re-run it can be sitting in dist/ via
          # merge-multiple, downloaded from this job's own earlier artifact.
          rm -f dist/latest.json
          gh release upload "$TAG" dist/* --clobber
          echo "draft $TAG carries:"
          gh release view "$TAG" --json assets --jq '.assets[].name'

      # THE flip. One command, one moment, everything already in place.
      - name: Publish
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --prerelease=false --latest
          echo "::notice title=Released::$TAG is public."

      # Handed to the desktop-latest job rather than attached to the release —
      # see the assembly step for why a versioned release must not carry a
      # manifest full of rolling-tag URLs.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: updater-manifest
          path: manifest/latest.json
          if-no-files-found: error
          retention-days: 7

  # The legacy updater bridge. `desktop-latest` is a FIXED tag, not GitHub's
  # floating "latest release": the endpoint is compiled into every shipped
  # binary, so the tag can never be renamed or deleted without stranding
  # installs. It is marked prerelease so the rolling build stays out of the
  # repo's "Latest release" badge, which belongs to the versioned tag.
  #
  # Runs after `publish`, never beside it: the versioned release is the record,
  # this is a convenience mirror of it for already-installed clients.
  desktop-latest:
    needs: [preflight, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Refresh the rolling updater release
        run: |
          set -euo pipefail
          tag=desktop-latest
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --prerelease \
            --title "$tag (auto-built)" \
            --notes "Rolling desktop build. The in-app updater reads latest.json from this release. Not a version release — see desktop-v* tags for the versioned desktop app."

          # Assets first, manifest LAST. A client that checks in mid-refresh
          # must never read a manifest naming a file that is not there yet;
          # reading the previous complete manifest is always safe.
          gh release upload "$tag" --clobber \
            "dist/TennoWorth_${VERSION}_x64-setup.exe" \
            "dist/TennoWorth_${VERSION}_x64-setup.exe.sig" \
            "dist/TennoWorth_${VERSION}_x64_en-US.msi" \
            "dist/TennoWorth_${VERSION}_x64_en-US.msi.sig" \
            dist/TennoWorth-x86_64.AppImage \
            dist/TennoWorth-x86_64.AppImage.sig
          gh release upload "$tag" --clobber dist/latest.json

      # Stale-asset cleanup runs AFTER the upload, never before.
      #
      # It used to run first, which meant desktop-latest sat empty for the whole
      # ~8-minute build and latest.json 404'd for every client that checked in
      # that window — trading the stale-asset bug for a worse one. Cleaning up
      # afterwards means the previous release stays intact and servable right up
      # until the new one replaces it, and clients only ever see a complete
      # manifest: the old version during the build, the new one after.
      #
      # The AppImage is named without a version, so it is kept by name rather
      # than by the version match — it was just overwritten above.
      - name: Remove superseded assets from the rolling release
        run: |
          set -euo pipefail
          gh release view desktop-latest --json assets --jq '.assets[].name' | while read -r asset; do
              [ -z "$asset" ] && continue
              case "$asset" in
                latest.json)                 echo "keep (manifest):  $asset" ;;
                TennoWorth-x86_64.AppImage|TennoWorth-x86_64.AppImage.sig)
                                             echo "keep (unversioned): $asset" ;;
                *"$VERSION"*)                echo "keep (current):   $asset" ;;
                *)                           echo "remove (stale):   $asset"
                                             gh release delete-asset desktop-latest "$asset" --yes ;;
              esac
            done
