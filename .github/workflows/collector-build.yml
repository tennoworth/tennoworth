name: collector-build

# Publish one opt-in collector service from production. Each collector keeps
# its own caller workflow, rolling release and host units; this file holds the
# classification and publication they share.
on:
  workflow_call:
    secrets:
      COLLECTOR_SIGNING_KEY:
        description: Collector signing key from the main-only environment.
        required: true
    inputs:
      crate:
        description: tennoworth-collectors binary that is published.
        required: true
        type: string
      module:
        description: The binary's own module under tennoworth-collectors/src.
        required: true
        type: string
      caller:
        description: The calling workflow file, which is an input of its own build.
        required: true
        type: string
      tag:
        description: Rolling release tag the host puller reads.
        required: true
        type: string
      body:
        description: Release description.
        required: true
        type: string

jobs:
  # The input list used to sit on `on.push`, which is the wrong place for a
  # publisher. GitHub evaluates only the first 300 files of a diff: a promotion
  # large enough to push this crate past that window would leave this workflow
  # not running at all, and the service would silently stay on the previous
  # binary. A workflow that never starts also leaves no trace to notice. Moving
  # the decision into a job keeps the whole diff and makes a skip a visible
  # skipped job.
  changes:
    # A manual publish is the recovery path for a binary that did not update on
    # its own, so it must not run classification at all: checkout, the diff and
    # the parse below are each things that can fail, and the recovery path cannot
    # depend on the machinery it exists to recover from.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Without an explicit `base` the action falls back to the repository
          # default branch, which is `develop` here. A push to `main` would then
          # compare main against develop through their merge base; since main is
          # normally an ancestor of develop that diff is empty, so every push
          # published and a revert on main could still be missed. Compare the
          # pushed range itself.
          base: ${{ github.event.before }}
          ref: ${{ github.sha }}
          # The default `some` quantifier ORs the patterns independently, so the
          # exclusion below would match every other path instead of excluding it.
          predicate-quantifier: 'some-with-excludes'
          filters: |
            build:
              - 'rust/tennoworth-collectors/Cargo.toml'
              - 'rust/tennoworth-collectors/src/lib.rs'
              - 'rust/tennoworth-collectors/src/gate.rs'
              - 'rust/tennoworth-collectors/src/${{ inputs.module }}/**'
              - 'rust/tennoworth-collectors/src/bin/${{ inputs.crate }}.rs'
              - 'rust/Cargo.toml'
              - 'rust/Cargo.lock'
              - '!**/AGENTS.md'
              - '.github/workflows/${{ inputs.caller }}'
              - '.github/workflows/collector-build.yml'
              - '.github/actions/setup-rust/**'
              - '.github/actions/publish-rolling-release/**'

      # `build` covers the paths the binary is built from, not a fail-closed net:
      # an unrelated change - a frontend-only promotion - must not republish a
      # collector. Its inputs are its own module and bin, the shared gate and
      # crate root, and the manifests; the other collector's module is not one.
      - name: Publish only when the service's inputs changed
        id: decide
        env:
          RESULTS: ${{ toJson(steps.filter.outputs) }}
          BEFORE: ${{ github.event.before }}
          CRATE: ${{ inputs.crate }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          build=$(echo "$RESULTS" | jq -r '.build')
          # An absent or all-zero `before` means there is no previous tree to
          # compare against, so publish rather than trust the action's fallback.
          if [ "$build" = "true" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "No input to $CRATE changed; leaving $TAG as it is."
          fi

  build:
    needs: changes
    # Serialize publishers of this rolling release, and only them. The box pulls
    # whichever asset is newest by timestamp, so two concurrent builds of this
    # binary could let the older tree win. This sits on the job rather than the
    # workflow so a run that classifies as "nothing to publish" never holds or
    # evicts a slot - a skipped job never enters the queue, and a queued one is
    # replaced by the next arrival. `cancel-in-progress` stays false so an
    # in-flight publication is not interrupted; a later run may not repeat it.
    concurrency:
      group: build-${{ inputs.crate }}
      cancel-in-progress: false
    # `!cancelled()` is load-bearing, not decoration: a job whose `needs`
    # dependency was skipped is itself skipped unless its condition includes a
    # status function, so a manual publish - which skips classification by
    # design - would otherwise never run. The push branch still requires the
    # classifier to have succeeded, so a failed classification blocks publication
    # instead of publishing blind. The `branches` filter on `push` does not
    # restrict `workflow_dispatch`, hence the main-ref guard.
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (needs.changes.result == 'success' && needs.changes.outputs.build == 'true')
      )
    # ubuntu-22.04 for its glibc 2.35 - same rationale as release-desktop.yml's
    # linux-binary job (backward- but no forward-compat).
    runs-on: ubuntu-22.04
    # The box installs this binary as root only when it carries the collector
    # key's signature. The key is a secret of this main-only environment, so a
    # token that can edit release assets cannot produce one.
    environment: collector-release
    defaults:
      run:
        working-directory: rust
    env:
      CRATE: ${{ inputs.crate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-rust

      - name: Build
        run: cargo build --release -p tennoworth-collectors --bin "$CRATE"

      - name: Package + checksum
        run: |
          mkdir -p ../dist
          cp "target/release/$CRATE" "../dist/$CRATE"
          cd ../dist
          sha256sum "$CRATE" > "$CRATE.sha256"
          cat "$CRATE.sha256"

      # deploy/bin/pull-collector.sh requires the trusted comment to start with
      # "tennoworth-collector <binary> ", so a signature for one collector cannot
      # install as the other.
      - name: Sign
        env:
          COLLECTOR_SIGNING_KEY: ${{ secrets.COLLECTOR_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "$COLLECTOR_SIGNING_KEY" || { echo "Configure COLLECTOR_SIGNING_KEY in the collector-release environment." >&2; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          key="$RUNNER_TEMP/collector-signing.key"
          (umask 077 && printf '%s\n' "$COLLECTOR_SIGNING_KEY" > "$key")
          minisign -S -s "$key" -m "../dist/$CRATE" -x "../dist/$CRATE.minisig" \
            -t "tennoworth-collector $CRATE $GITHUB_SHA" </dev/null
          rm -f "$key"

      - name: Publish rolling release
        uses: ./.github/actions/publish-rolling-release
        with:
          tag_name: ${{ inputs.tag }}
          release_name: ${{ inputs.tag }} (auto-built)
          files: |
            dist/${{ inputs.crate }}
            dist/${{ inputs.crate }}.sha256
            dist/${{ inputs.crate }}.minisig
          body: ${{ inputs.body }}
