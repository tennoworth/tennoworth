name: republish-rolling

# The publishers decide from the pushed range, so a publication that fails stays
# failed until some later push happens to touch the same inputs again. Nothing
# watches for that, and a red run is easy to miss, which is how production can sit
# on a stale artifact indefinitely.
#
# A manual dispatch of a publisher skips classification entirely - that is what
# `!cancelled()` in its publish guard exists for - so dispatching the three of
# them repairs whatever was left behind. Doing it on a schedule bounds how long
# that can last, and doubles as a weekly canary for the whole publish path.
#
# This is a bound, not a guarantee: GitHub can drop a scheduled run, and the
# dispatch only repairs what a publisher then rebuilds from `main`. Nothing here
# records what production is actually serving, which is deliberate - tracking that
# would mean a marker that can itself disagree with the artifacts.
on:
  schedule:
    # Monday, after audit's 04:17 and ui-smoke's 05:47 crons, so the caches they
    # seed are there to reuse rather than being warmed twice in parallel.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # Only so this can dispatch the publishers. Nothing here builds or publishes.
  actions: write

jobs:
  republish:
    runs-on: ubuntu-latest
    # The measurement below waits for each dispatched publisher to finish, and the
    # web build is the slow one.
    timeout-minutes: 45
    strategy:
      # One publisher failing must not stop the other two from being dispatched.
      fail-fast: false
      matrix:
        workflow: [build-web.yml, build-scrape.yml, build-usage.yml]
    steps:
      # Dispatch `${{ matrix.workflow }}` on `main` and then require it to have
      # actually done something. `gh workflow run` exits 0 as soon as the run is
      # created, and a publisher that refuses the ref still reports its own jobs
      # as skipped rather than failing, so the exit code alone cannot distinguish
      # a repair from a no-op. Observed live: dispatching a publisher without
      # `--ref main` produced `branch=develop completed/skipped` with both jobs
      # skipped. Without this check, dropping `--ref main` here would leave the
      # weekly repair green and permanently useless.
      - name: Dispatch and require ${{ matrix.workflow }} to publish
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ matrix.workflow }}
        run: |
          set -euo pipefail

          # The id of the newest dispatch run before we fire, so the wait below
          # cannot mistake someone else's run for ours.
          before=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" \
            --branch main --event workflow_dispatch --limit 1 \
            --json databaseId --jq '.[0].databaseId // 0')

          # A scheduled run's own context is the default branch (`develop`), and
          # the publishers only publish from `main`, so the ref is explicit.
          # `--repo` is required because `gh` otherwise infers the repository from
          # a local git remote, and this job never checks one out.
          gh workflow run "$WORKFLOW" --ref main --repo "$GITHUB_REPOSITORY"

          id=""
          for _ in $(seq 1 30); do
            id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" \
              --branch main --event workflow_dispatch --limit 1 \
              --json databaseId --jq '.[0].databaseId // 0')
            if [ -n "$id" ] && [ "$id" != "0" ] && [ "$id" != "$before" ]; then break; fi
            id=""
            sleep 5
          done
          if [ -z "$id" ]; then
            echo "::error::$WORKFLOW was dispatched but no run appeared on main."
            exit 1
          fi

          gh run watch "$id" --repo "$GITHUB_REPOSITORY" --interval 20 >/dev/null || true
          conclusion=$(gh run view "$id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion')
          echo "$WORKFLOW run $id concluded: $conclusion"
          # `skipped` is the wrong-ref signature: the publisher's own guard turned
          # the build away. Anything other than success means the repair did not
          # happen, and a repair that silently does not happen is the failure this
          # workflow exists to prevent.
          case "$conclusion" in
            success) ;;
            *)
              echo "::error::$WORKFLOW run $id concluded '$conclusion', not success."
              exit 1
              ;;
          esac
