name: build-reports

# Publish the isolated opt-in price-report service from production.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/collector-build.yml
    with:
      crate: tennoworth-reports
      module: reports
      caller: build-reports.yml
      tag: reports-latest
      body: Rolling build of the opt-in price-report collector from main.
