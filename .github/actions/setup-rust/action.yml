name: Setup Rust toolchain + cache
description: >
  dtolnay/rust-toolchain + Swatinem/rust-cache, the pair every companion CI
  job needs. Centralized so a toolchain-action swap or a cache-key change
  lands in one place instead of six.
inputs:
  workspaces:
    description: Passed through to Swatinem/rust-cache's `workspaces` input.
    required: false
    default: rust
  shared-key:
    description: Compatibility group shared across jobs; empty preserves the job-based key.
    required: false
    default: ''
  key:
    description: Additional job key, used only when shared-key is empty.
    required: false
    default: ''
runs:
  using: composite
  steps:
    # Pinned to full commit SHAs, with the human-readable ref in the comment.
    # A mutable tag (or a branch, which `@stable` is) means a third party can
    # change what runs inside a job that builds and signs release binaries,
    # after review, without anything in this repo changing. The `stable`
    # BRANCH of dtolnay/rust-toolchain is what selects the stable toolchain,
    # so this pin still installs stable Rust - it only freezes the action's
    # own code. Bump these deliberately.
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: ${{ inputs.workspaces }}
        shared-key: ${{ inputs.shared-key }}
        key: ${{ inputs.key }}
        cache-workspace-crates: false
        # Restore-only on pull requests. A cache a pull_request run writes is
        # scoped to that PR's merge ref, so no other pull request and no branch
        # can ever read it, while every PR re-writes roughly the same archives.
        # Measured 2026-09-13: 23 entries totalling 11.29 GiB against GitHub's
        # 10 GB per-repository limit, 9.46 GiB of it stranded on merge refs.
        # That pressure evicts the default-branch entries a pull request can
        # actually restore from, so PRs compiled cold *and* re-uploaded the
        # result - the cache thrashing GitHub documents. push, schedule and
        # workflow_dispatch runs still save; those are the runs whose caches a
        # pull request is allowed to read.
        save-if: ${{ github.event_name != 'pull_request' }}
