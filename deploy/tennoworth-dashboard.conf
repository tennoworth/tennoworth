# Host paths the private dashboard needs; install as
# /etc/tmpfiles.d/tennoworth-dashboard.conf and apply before enabling the job
# path units.
#
# Job request directories. The parent stays root's so the publisher can only
# write into these, and each path unit watches exactly one of them: creating a
# directory beside a watched one would wake a unit still watching its parent.
d /srv/wfm/jobs 0755 root root -
d /srv/wfm/jobs/scrape 0700 tennoworth-publisher tennoworth-publisher -
d /srv/wfm/jobs/readiness 0700 tennoworth-publisher tennoworth-publisher -
d /srv/wfm/jobs/backup 0700 tennoworth-publisher tennoworth-publisher -
d /srv/wfm/jobs/web-pull 0700 tennoworth-publisher tennoworth-publisher -
d /srv/wfm/jobs/policy-pull 0700 tennoworth-publisher tennoworth-publisher -
