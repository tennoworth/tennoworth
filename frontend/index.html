<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Theme boot: stamps data-look / data-mode on <html> from the persisted
      preference before the stylesheet paints (why it is a classic, blocking,
      same-origin script rather than part of the module bundle - see the file).
    -->
    <script src="/theme-boot.js"></script>
    <!--
      Defense-in-depth CSP. Allowed origins:
        connect-src: self only - the informational site loads everything
                     (market.json, wfstat-catalog.json) same-origin.
                     warframestat.us was dropped when upstream dropped CORS
                     (2026-06-09); the resolver catalog is baked now.
        script-src:  self only - no inline, no remote scripts
        style-src:   self + 'unsafe-inline' for Svelte's scoped style injection
        img-src:     self + data: (Vite injects small assets as data: URIs)

      `frame-ancestors`, `Strict-Transport-Security`, and `X-Frame-Options`
      can only be set as real HTTP headers, not via <meta>. They live in
      public/_headers for Cloudflare Pages / Netlify / Vercel deployments.
      GitHub Pages silently drops that file, which is one reason we'll move
      off it for production. The CSP below still gives us script/connect/
      style protection on GH Pages.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        connect-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        font-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
      "
    />
    <meta http-equiv="Referrer-Policy" content="no-referrer" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

    <title>TennoWorth | Warframe Market Prices &amp; Inventory Tool</title>
    <meta
      name="description"
      content="Check Warframe market prices and find what to sell for platinum. Browse free, or rank your inventory with TennoWorth for Windows and Linux. No Overwolf required."
    />
    <link rel="canonical" href="https://tennoworth.app/" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#CFCBB2" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#2A2823" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      og:url / og:image use the canonical absolute origin because social
      scrapers (Discord, Twitter, Slack) fetch them server-side, not
      relative to the page. They are NOT subject to the page CSP. Update
      the origin here if the canonical domain changes from tennoworth.app.
    -->
    <meta property="og:site_name" content="TennoWorth" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tennoworth.app/" />
    <meta property="og:title" content="TennoWorth | Warframe Market Prices &amp; Inventory Tool" />
    <meta
      property="og:description"
      content="Check Warframe market prices and find what to sell for platinum. Free inventory tools for Windows and Linux, without Overwolf. Your inventory stays local."
    />
    <meta property="og:image" content="https://tennoworth.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="TennoWorth — what to sell in Warframe, right now" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TennoWorth | Warframe Market Prices &amp; Inventory Tool" />
    <meta
      name="twitter:description"
      content="Check Warframe market prices and find what to sell for platinum. Free inventory tools for Windows and Linux, without Overwolf. Your inventory stays local."
    />
    <meta name="twitter:image" content="https://tennoworth.app/og.png" />
    <meta name="twitter:image:alt" content="TennoWorth — what to sell in Warframe, right now" />
    <noscript><style>#app { display: none; }</style></noscript>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://tennoworth.app/#website",
            "url": "https://tennoworth.app/",
            "name": "TennoWorth",
            "inLanguage": "en",
            "description": "Warframe market prices and inventory tools to help you decide what to sell."
          },
          {
            "@type": "SoftwareApplication",
            "@id": "https://tennoworth.app/#application",
            "name": "TennoWorth",
            "url": "https://tennoworth.app/#desktop",
            "operatingSystem": "Windows, Linux",
            "applicationCategory": "UtilitiesApplication",
            "description": "Free, open-source Warframe inventory and market dashboard for Windows and Linux. Rank owned items by sell priority without Overwolf; inventory stays on your machine.",
            "isAccessibleForFree": true,
            "license": "https://github.com/tennoworth/tennoworth/blob/main/LICENSE",
            "downloadUrl": "https://github.com/tennoworth/tennoworth/releases/latest",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <!--
      Crawlable fallback for non-JS bots and a plain-text description of
      the tool. The Svelte app mounts into #app and never touches this
      sibling; users with JS see the real app, not this block.
    -->
    <noscript>
      <main style="max-width:42rem;margin:4rem auto;padding:0 1.25rem;font-family:var(--font-body, system-ui),sans-serif;color:var(--fg, #46422F);background:var(--panel, #DBD7BF);line-height:var(--leading-body, 1.55);">
        <h1>TennoWorth - what to sell in Warframe, right now</h1>
        <p>
          Browse Warframe market prices, price movers, and vaulted items for
          free. TennoWorth uses warframe.market price snapshots to help you
          decide what to sell for platinum. Enable JavaScript to search items
          and explore the market dashboard.
        </p>
        <p>
          The desktop app treats <strong>Windows + Linux as equal, first-class
          targets</strong>, including Steam Deck. There's no TennoWorth account
          and no inventory upload: the app reads your inventory from the
          running game and keeps it on your machine.
        </p>
        <p>
          The free, open-source desktop app ranks your owned items by sell
          priority and compares sets, parts, and ducat value. No Overwolf required.
        </p>
        <p>
          <a href="https://github.com/tennoworth/tennoworth/releases/latest">Download TennoWorth for Windows or Linux</a>
          · <a href="https://github.com/tennoworth/tennoworth">Source code</a>
          · <a href="https://github.com/tennoworth/tennoworth/blob/main/SECURITY.md">Trust and safety</a>
        </p>
        <p>TennoWorth is a fan project, not affiliated with Digital Extremes or warframe.market.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
